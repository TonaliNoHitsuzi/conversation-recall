<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-theme-mode="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库终端</title>
<script>
/* 主题引导：首帧前确定明暗，避免闪烁。localStorage 无记录时跟随系统。 */
(function(){
  var mode = null;
  try{ mode = localStorage.getItem('kb-theme'); }catch(e){}
  var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var hash = /[#&]theme=(light|dark)/.exec(location.hash || '');
  if(!mode && hash) mode = hash[1];
  document.documentElement.dataset.themeMode = mode || 'auto';
  document.documentElement.dataset.theme = mode || (dark ? 'dark' : 'light');
})();
</script>
<link rel="stylesheet" href="assets/github-markdown.css">
<style>
/* ============ 设计变量：暖纸底 × 深海军蓝墨 × 单一青石蓝强调 ============ */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "JetBrains Mono", monospace;
  --radius: 8px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#F0EEE9; --panel:#FBFAF7; --panel-2:#F2F0E9; --hover:#ECEAE2;
  --ink:#12283F; --ink-2:#50637A; --ink-3:#8A99AB;
  --line:#DFDACD; --line-2:#C7C0AE;
  --accent:#0F5BB5; --accent-strong:#0B4A96; --accent-soft:rgba(15,91,181,.09);
  --good:#177245; --good-soft:rgba(23,114,69,.12);
  --warn:#A84E08; --warn-soft:rgba(168,78,8,.12);
  --bad:#C22F2F;  --bad-soft:rgba(194,47,47,.10);
  --dom-conv:#0E7C8C; --dom-weekly:#B15E09; --dom-project:#6C3FC4; --dom-gray:#6B7684;
  --code-bg:#EFEEE7;
  --shadow-sm:0 1px 2px rgba(18,40,63,.07);
  --shadow-lg:0 12px 32px rgba(18,40,63,.14), 0 2px 6px rgba(18,40,63,.08);
  --hljs-comment:#6E7781; --hljs-keyword:#CF222E; --hljs-string:#0A3069;
  --hljs-number:#0550AE;  --hljs-title:#8250DF;   --hljs-attr:#0550AE;
  --hljs-builtin:#953800; --hljs-meta:#6E7781;    --hljs-add:#116D29; --hljs-del:#82071E;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0D1218; --panel:#141B24; --panel-2:#1B2430; --hover:#202B39;
  --ink:#C7D1DD; --ink-2:#8C99A9; --ink-3:#5D6B7C;
  --line:#27313F; --line-2:#37434F;
  --accent:#5C9CEC; --accent-strong:#7FB2F2; --accent-soft:rgba(92,156,236,.15);
  --good:#47B97F; --good-soft:rgba(71,185,127,.15);
  --warn:#E09A4A; --warn-soft:rgba(224,154,74,.15);
  --bad:#E86B6B;  --bad-soft:rgba(232,107,107,.14);
  --dom-conv:#3BB9C9; --dom-weekly:#E09A4A; --dom-project:#A98CF0; --dom-gray:#7D8B9C;
  --code-bg:#0F1720;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
  --hljs-comment:#8B949E; --hljs-keyword:#FF7B72; --hljs-string:#A5D6FF;
  --hljs-number:#79C0FF;  --hljs-title:#D2A8FF;   --hljs-attr:#79C0FF;
  --hljs-builtin:#FFA657; --hljs-meta:#8B949E;    --hljs-add:#3FB950; --hljs-del:#F85149;
}

/* ============ 基础 ============ */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  background:var(--bg); color:var(--ink);
  font:14px/1.6 var(--font);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
button{font-family:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.scroll{scrollbar-width:thin; scrollbar-color:var(--line-2) transparent}
.scroll::-webkit-scrollbar{width:8px;height:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
.scroll::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
.ic{width:15px;height:15px;flex:0 0 auto;vertical-align:-2px}
.ic-lg{width:26px;height:26px;color:var(--ink-3)}

/* ============ header ============ */
header{flex:0 0 auto; z-index:30; background:var(--panel); border-bottom:1px solid var(--line); box-shadow:var(--shadow-sm)}
.bar{display:flex; align-items:center; gap:8px; max-width:1800px; margin:0 auto; padding:8px 14px}
.brand{display:flex; align-items:center; gap:8px; margin-right:4px; user-select:none}
.brand-mark{width:24px;height:24px;border-radius:6px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand-mark svg{width:15px;height:15px;stroke:var(--bg)}
:root[data-theme="dark"] .brand-mark{background:var(--accent)}
:root[data-theme="dark"] .brand-mark svg{stroke:#0D1218}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand-tag{font-size:10px;font-weight:600;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.searchbox{
  flex:1 1 220px; min-width:160px; max-width:560px; display:flex; align-items:center; gap:7px;
  background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:5px 10px; transition:border-color .15s, box-shadow .15s;
}
.searchbox:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:var(--panel)}
.searchbox .ic{color:var(--ink-3)}
.searchbox input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:14px var(--font); outline:none}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox kbd{font:600 11px var(--mono); color:var(--ink-3); background:var(--panel); border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px}
.bar-util{display:flex; align-items:center; gap:6px; margin-left:auto}

/* 控件/按钮（沿用 v2 语言） */
.btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 11px; border:1px solid var(--line); border-radius:7px;
  background:var(--panel); color:var(--ink);
  font:500 13px/1.4 var(--font); cursor:pointer; white-space:nowrap;
  transition:background .15s, border-color .15s, transform .15s, box-shadow .15s;
}
.btn:hover{background:var(--hover); border-color:var(--line-2); transform:translateY(-1px); box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0); box-shadow:none}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:var(--accent-strong); border-color:var(--accent-strong)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft); border-color:var(--bad)}
.btn.icon-only{padding:6px 8px}
.btn.armed{background:var(--bad)!important; border-color:var(--bad)!important; color:#fff!important; position:relative; overflow:hidden}
.btn.armed::after{content:''; position:absolute; left:0; bottom:0; height:2px; width:100%; background:rgba(255,255,255,.9); animation:armcount 3.5s linear forwards}
@keyframes armcount{from{width:100%}to{width:0}}
.btn.fav-on{color:#E8A13A; border-color:color-mix(in srgb, #E8A13A 45%, transparent); background:color-mix(in srgb, #E8A13A 10%, transparent)}
input[type="text"],input[type="date"],textarea,.fld{
  padding:6px 10px; border:1px solid var(--line); border-radius:7px;
  background:var(--panel); color:var(--ink); font:13px var(--font); outline:none;
  transition:border-color .15s, box-shadow .15s;
}
input[type="text"]:focus,input[type="date"]:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.notq{width:130px}
.selwrap{position:relative; display:inline-flex}
.selwrap select{
  appearance:none; -webkit-appearance:none;
  padding:6px 26px 6px 10px; border:1px solid var(--line); border-radius:7px;
  background:var(--panel); color:var(--ink); font:500 13px var(--font); cursor:pointer;
}
.selwrap select:hover{border-color:var(--line-2); background:var(--hover)}
.selwrap::after{content:''; position:absolute; right:10px; top:50%; width:6px; height:6px; border-right:1.5px solid var(--ink-2); border-bottom:1.5px solid var(--ink-2); transform:translateY(-70%) rotate(45deg); pointer-events:none}

/* ============ 主区：库导航 + 工作台 + 详情 ============ */
.main{
  flex:1 1 auto; min-height:0; width:100%; max-width:1800px; margin:0 auto;
  display:grid; grid-template-columns:230px minmax(320px,5fr) minmax(420px,7fr); gap:10px; padding:10px 14px;
  transition:grid-template-columns .25s var(--ease);
}
body.nav-hidden .main{grid-template-columns:0 minmax(320px,5fr) minmax(420px,7fr)}
.pane{
  display:flex; flex-direction:column; min-height:0; min-width:0;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow-sm); overflow:hidden;
}
.pane-nav{transition:opacity .2s; }
body.nav-hidden .pane-nav{opacity:0; pointer-events:none; border-color:transparent}
.pane-head{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  padding:9px 12px; border-bottom:1px solid var(--line);
  font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--ink-3);
}
.pane-head .spacer{flex:1}
.pane-head .cnt{font-weight:600; letter-spacing:0; font-variant-numeric:tabular-nums}
.mini-btn{
  display:inline-flex; align-items:center; gap:4px; border:0; background:transparent;
  color:var(--accent); font:600 12px var(--font); letter-spacing:0; cursor:pointer; padding:2px 6px; border-radius:5px;
}
.mini-btn:hover{background:var(--accent-soft)}
.pane-body{flex:1 1 auto; min-height:0; overflow-y:auto; padding:8px}
.pane-body.flush{padding:0}

/* 库导航 */
.nav-sec{padding:6px 6px 2px; font-size:10px; font-weight:700; letter-spacing:.14em; color:var(--ink-3)}
.nav-item{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  padding:6px 8px; border:0; border-radius:7px; background:transparent; color:var(--ink);
  font:500 13px var(--font); cursor:pointer; transition:background .12s;
}
.nav-item:hover{background:var(--hover)}
.nav-item.on{background:var(--accent-soft)}
.nav-item.on .nav-label{color:var(--accent); font-weight:600}
.nav-item .nav-label{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nav-item .nav-ico{width:18px; text-align:center; flex:0 0 auto}
.nav-item .nav-cnt{font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; flex:0 0 auto}
.nav-item .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.nav-folder{margin:2px 0}
.nav-folder > .nav-item .car{transition:transform .15s}
.nav-folder.open > .nav-item .car{transform:rotate(90deg)}
.nav-folder .nav-kids{display:none; padding-left:14px}
.nav-folder.open .nav-kids{display:block}
.nav-search{padding:6px 8px 8px}
.nav-search input{width:100%}

/* 工作台 */
.ws-filters{
  flex:0 0 auto; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  padding:8px 10px; border-bottom:1px solid var(--line);
}
.ws-filters .chip{
  border:1px solid var(--line); background:var(--panel-2); color:var(--ink-2);
  font:500 12px var(--font); padding:3px 10px; border-radius:99px; cursor:pointer; transition:all .15s;
}
.ws-filters .chip:hover{border-color:var(--accent); color:var(--accent)}
.ws-filters .chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
.ws-genres{display:flex; gap:5px; flex-wrap:wrap; align-items:center}
.genre-chip{
  display:inline-flex; align-items:center; gap:3px;
  border:1px solid var(--line); background:transparent; color:var(--ink-2);
  font:500 11px var(--font); padding:1px 8px; border-radius:99px; cursor:pointer; transition:all .12s;
}
.genre-chip:hover{border-color:var(--accent); color:var(--accent)}
.genre-chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}

/* 结果卡片（沿用 v2 手感） */
.hit{
  position:relative; display:block; width:100%; text-align:left; cursor:pointer;
  background:transparent; border:1px solid transparent; border-radius:var(--radius);
  padding:8px 11px 8px 13px; margin:0 0 4px; color:var(--ink);
  transition:background .15s, border-color .15s;
}
.hit:hover{background:var(--hover)}
.hit.sel{background:var(--accent-soft); border-color:var(--accent-soft)}
.hit.sel::before{content:''; position:absolute; left:0; top:8px; bottom:8px; width:2px; background:var(--accent); border-radius:2px}
.hit-top{display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-bottom:2px}
.hit-title{display:block; font-weight:600; font-size:14px; line-height:1.45}
.hit-sub{display:block; color:var(--ink-2); font-size:12px; margin-top:1px}
.hit-snip{display:block; color:var(--ink-3); font-size:12px; line-height:1.55; margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.hit-matched{font-size:11px; color:var(--ink-3); cursor:help}
.hit-fav{margin-left:auto; border:0; background:transparent; cursor:pointer; padding:2px; color:var(--ink-3); border-radius:5px; flex:0 0 auto}
.hit-fav:hover{color:#E8A13A; background:var(--panel-2)}
.hit-fav.on{color:#E8A13A}
.tag{display:inline-flex; align-items:center; padding:1px 7px; border-radius:99px; font-size:11px; font-weight:600; line-height:1.6}
.tag.c-conv{background:color-mix(in srgb, var(--dom-conv) 13%, transparent); color:var(--dom-conv)}
.tag.c-week{background:color-mix(in srgb, var(--dom-weekly) 14%, transparent); color:var(--dom-weekly)}
.tag.c-proj{background:color-mix(in srgb, var(--dom-project) 13%, transparent); color:var(--dom-project)}
.tag.c-gray{background:var(--panel-2); color:var(--ink-2); border:1px solid var(--line)}
.bdg{display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:0 6px; border-radius:99px; line-height:1.7}
.bdg-good{background:var(--good-soft); color:var(--good)}
.bdg-bad{background:var(--bad-soft); color:var(--bad)}
.bdg-warn{background:var(--warn-soft); color:var(--warn)}

/* 详情 */
.dt-sticky{position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); padding:11px 14px 10px}
.dt-title-row{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:8px}
.dt-title{font-size:16px; font-weight:700; margin:0; line-height:1.4; min-width:0}
.dt-pill{display:inline-flex; align-items:center; gap:5px; text-decoration:none; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:600; background:var(--accent-soft); color:var(--accent); border:1px solid transparent; transition:border-color .15s, transform .15s; cursor:pointer}
.dt-pill:hover{border-color:var(--accent); transform:translateY(-1px)}
.dt-pill.gray{background:var(--panel-2); color:var(--ink-2); border-color:var(--line)}
.dt-actions{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.dt-actions .sep{width:1px; height:18px; background:var(--line); margin:0 2px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}
.seg .btn{border:0; border-radius:0; border-right:1px solid var(--line)}
.seg .btn:last-child{border-right:0}
.seg .btn:hover{transform:none; box-shadow:none}
.dt-md{padding:6px 18px 40px}
.sib-sec{padding:10px 16px; border-top:1px solid var(--line); background:var(--panel-2)}
.sib-sec h4{margin:0 0 8px; font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--ink-3)}
.sib-item{display:flex; align-items:center; gap:7px; padding:5px 7px; border-radius:6px; cursor:pointer; font-size:12.5px; color:var(--ink)}
.sib-item:hover{background:var(--hover)}
.sib-item .ic{color:var(--ink-3)}
.sib-thumbs{display:flex; gap:8px; flex-wrap:wrap}
.sib-thumb{position:relative; width:96px; border:1px solid var(--line); border-radius:7px; overflow:hidden; background:var(--panel); cursor:pointer}
.sib-thumb img{width:100%; height:64px; object-fit:cover; display:block}
.sib-thumb span{display:block; font-size:10px; padding:3px 5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sib-thumb a{position:absolute; top:4px; right:4px; background:rgba(0,0,0,.55); color:#fff; border-radius:5px; padding:2px 5px; font-size:11px; text-decoration:none; opacity:0; transition:opacity .15s}
.sib-thumb:hover a{opacity:1}

/* 图片下载浮层 */
.mdhost .img-wrap{position:relative; display:inline-block; max-width:100%}
.mdhost .img-wrap img{display:block}
.img-dl{
  position:absolute; top:6px; right:6px; display:inline-flex; align-items:center; gap:3px;
  background:rgba(9,14,20,.6); color:#fff; border-radius:6px; padding:3px 7px;
  font-size:11px; text-decoration:none; opacity:0; transition:opacity .15s;
}
.img-wrap:hover .img-dl{opacity:1}

/* 代码 / mermaid 工具条 */
.codeblock{position:relative}
.block-tools{position:absolute; top:6px; right:6px; display:flex; gap:4px; opacity:0; transition:opacity .15s; z-index:2}
.codeblock:hover .block-tools{opacity:1}
.block-tools .tbtn{
  display:inline-flex; align-items:center; gap:3px;
  border:1px solid var(--line); background:var(--panel); color:var(--ink-2);
  font:500 11px var(--font); padding:2px 7px; border-radius:6px; cursor:pointer;
}
.block-tools .tbtn:hover{color:var(--accent); border-color:var(--accent)}
.mdhost .mermaid{position:relative; display:flex; justify-content:center; padding:12px 0}

/* callout / issue / 灰库（沿用 v2） */
.callout{border:1px solid var(--line); border-left:2px solid var(--warn); background:var(--warn-soft); border-radius:0 8px 8px 0; padding:9px 12px; margin:10px 0; font-size:13px}
.callout.issue-resolved{border-left-color:var(--good); background:var(--good-soft)}
.callout .when{display:block; color:var(--ink-2); font-size:11px; margin-top:3px}
.callout .lnk{color:var(--accent); cursor:pointer; text-decoration:none; font-weight:600}
.callout .lnk:hover{text-decoration:underline}
.callout.clickable{cursor:pointer; transition:transform .15s, box-shadow .15s}
.callout.clickable:hover{transform:translateY(-1px); box-shadow:var(--shadow-sm)}
.status-pill{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.06em; padding:0 6px; border-radius:4px; margin-right:6px}
.status-pill.open{background:var(--warn-soft); color:var(--warn)}
.status-pill.resolved{background:var(--good-soft); color:var(--good)}
.gray-item{display:flex; align-items:center; justify-content:space-between; gap:8px; border:1px solid var(--line); border-radius:var(--radius); padding:9px 11px; margin-bottom:6px; cursor:pointer; background:var(--panel); transition:border-color .15s, background .15s, transform .15s}
.gray-item:hover{border-color:var(--accent); background:var(--accent-soft); transform:translateY(-1px)}
.gray-item > span{flex:1; min-width:0; display:flex; align-items:center; gap:7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* 空态 / 骨架 / 提示 */
.empty{padding:40px 22px; text-align:center; color:var(--ink-2)}
.empty .ic-lg{margin-bottom:10px}
.empty .e-title{font-size:14px; font-weight:600; color:var(--ink); margin-bottom:4px}
.empty .e-sub{font-size:12px; color:var(--ink-3); line-height:1.7}
.empty .e-tips{margin-top:14px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap}
.empty kbd{font:600 11px var(--mono); background:var(--panel-2); border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 4px; color:var(--ink-2)}
.chip{border:1px solid var(--line); background:var(--panel-2); color:var(--ink-2); font:500 12px var(--font); padding:3px 10px; border-radius:99px; cursor:pointer; transition:all .15s}
.chip:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.notice{font-size:12px; padding:7px 10px; border-radius:7px; margin-bottom:8px; background:var(--warn-soft); color:var(--warn); border:1px solid color-mix(in srgb, var(--warn) 25%, transparent)}
.sk{border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:8px}
.sk i{display:block; height:10px; border-radius:5px; margin-bottom:8px; background:linear-gradient(90deg, var(--panel-2) 25%, var(--hover) 50%, var(--panel-2) 75%); background-size:200% 100%; animation:shimmer 1.15s infinite linear}
.sk i:last-child{margin-bottom:0}
@keyframes shimmer{to{background-position:-200% 0}}

/* Toast / Modal */
#toastRoot{position:fixed; right:16px; bottom:16px; z-index:90; display:flex; flex-direction:column; gap:8px}
.toast{display:flex; align-items:flex-start; gap:8px; background:var(--panel); border:1px solid var(--line); border-left:2px solid var(--accent); border-radius:8px; box-shadow:var(--shadow-lg); padding:10px 14px; min-width:240px; max-width:360px; font-size:13px; animation:toast-in .25s var(--ease)}
.toast.good{border-left-color:var(--good)} .toast.good .ic{color:var(--good)}
.toast.bad{border-left-color:var(--bad)}   .toast.bad .ic{color:var(--bad)}
.toast.info .ic{color:var(--accent)}
.toast.out{opacity:0; transform:translateY(6px); transition:all .3s}
@keyframes toast-in{from{opacity:0; transform:translateY(8px)}}
.overlay{position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center; background:rgba(9,14,20,.45); backdrop-filter:blur(2px); padding:16px; animation:fade-in .15s}
.modal{width:min(560px,100%); max-height:88vh; overflow-y:auto; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-lg); padding:18px 20px; animation:pop-in .2s var(--ease)}
.modal h3{margin:0 0 4px; font-size:15px}
.modal-sub{font-size:12px; color:var(--ink-2); margin:0 0 12px; line-height:1.6}
.modal textarea{width:100%; resize:vertical; min-height:100px; font:13px/1.6 var(--font)}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px}
.modal .hint{font-size:11px; color:var(--ink-3); margin-top:8px}
.fld-row{margin-bottom:12px}
.fld-row label{display:block; font-size:12px; font-weight:600; margin-bottom:4px}
.fld-row .fld-sub{font-size:11px; color:var(--ink-3); font-weight:400}
.fld-row input[type="text"], .fld-row textarea{width:100%}
.tagbox{display:flex; flex-wrap:wrap; gap:5px; border:1px solid var(--line); border-radius:7px; padding:6px 8px; background:var(--panel); cursor:text}
.tagbox input{border:0; outline:none; background:transparent; color:var(--ink); font:13px var(--font); flex:1; min-width:80px}
.tagbox .tchip{display:inline-flex; align-items:center; gap:4px; background:var(--accent-soft); color:var(--accent); font-size:12px; padding:1px 8px; border-radius:99px}
.tagbox .tchip b{cursor:pointer; font-weight:700}
.settings-sec{margin-bottom:16px}
.settings-sec h4{margin:0 0 8px; font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--ink-3)}
.settings-row{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line)}
.settings-row:last-child{border-bottom:0}
.settings-row .sr-label{flex:1; font-size:13px}
.settings-row .sr-sub{display:block; font-size:11px; color:var(--ink-3)}
.kbd-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px}
.kbd-grid div{font-size:12px; color:var(--ink-2)}
.kbd-grid kbd{font:600 11px var(--mono); background:var(--panel-2); border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 4px; color:var(--ink-2)}
details.adv summary{cursor:pointer; color:var(--accent); font-size:12px; font-weight:600}
details.adv .adv-body{padding:8px 0 0}
.lib-row{display:flex; align-items:center; gap:8px; padding:8px 6px; border-bottom:1px solid var(--line)}
.lib-row:last-child{border-bottom:0}
.lib-row .lr-label{flex:1; min-width:0}
.lib-row .lr-label b{font-size:13px}
.lib-row .lr-label span{display:block; font-size:11px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
@keyframes fade-in{from{opacity:0}}
@keyframes pop-in{from{opacity:0; transform:scale(.96) translateY(6px)}}

/* ============ github-markdown 颜色接管 + hljs 双主题（同 v2） ============ */
.markdown-body{background:transparent; color:var(--ink); font-family:var(--font); font-size:14.5px; line-height:1.75}

.hljs-emphasis{font-style:normal}
.hljs-strong{font-weight:700}

/* ==================== 渲染管线（顺序固定：marked → 图片重写 → mermaid → hljs → MathJax） ==================== */
let renderDomain = null;   // 当前渲染上下文的 domain（图片重写用）
function renderMd(mdText, el){
  /* Fix 3: 数学块先抽出占位，防 marked 把 \\ 吃成 \（矩阵换行依赖 \\） */
  const mathStash = [];
  let txt = mdText || '(空)';
  txt = txt.replace(/\$\$([\s\S]+?)\$\$/g, function(_, body){
    mathStash.push('$$' + body + '$$');
    return '\n\n@@MATH' + (mathStash.length - 1) + '@@\n\n';
  });
  txt = txt.replace(/(^|[^\\\$])\$([^\n\$][^\n\$]*?)\$(?!\d)/g, function(_, pre, body){
    mathStash.push('$' + body + '$');
    return pre + '@@MATH' + (mathStash.length - 1) + '@@';
  });
  el.innerHTML = marked.parse(txt);
  if(mathStash.length){
    let html = el.innerHTML;
    for(let i=0; i<mathStash.length; i++){
      html = html.split('@@MATH' + i + '@@').join(mathStash[i]);
    }
    el.innerHTML = html;
  }
  /* 需求 1：图片相对路径 → /api/raw */
  el.querySelectorAll('img').forEach(function(im){
    const src = im.getAttribute('src') || '';
    if(/^https?:\/\//i.test(src) || src.startsWith('data:')){ wrapImg(im, null); return; }
    if(renderDomain){
      const rawUrl = rawUrlOf(renderDomain, src, 0);
      im.src = rawUrl;
      wrapImg(im, rawUrl);
      return;
    }
    /* 无 domain 上下文：用 data URI 内联占位，防止 broken（真实后端下不会发生） */
    const ph = '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160"><rect width="640" height="160" fill="#DFDACD"/><text x="320" y="86" fill="#50637A" font-size="16" text-anchor="middle" font-family="sans-serif">图片：'+src.replace(/[<>&"]/g,'')+'</text></svg>';
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ph);
    wrapImg(im, null);
  });
  /* Fix 2: <a href> 本地文件链接也走 /api/raw（PDF、doc、zip 等）。
     http(s)/#/mailto/@@MATH 跳过；其余按当前 domain 的相对路径解析。 */
  el.querySelectorAll('a').forEach(function(a){
    const href = a.getAttribute('href') || '';
    if(!href || /^https?:\/\//i.test(href) || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('@@MATH')) return;
    if(renderDomain){
      a.href = rawUrlOf(renderDomain, href, 0);
      a.target = '_blank';
      a.rel = 'noopener';
    }
  });
  /* mermaid */
  el.querySelectorAll('code.language-mermaid').forEach(function(c){
    const pre = c.parentNode, d = document.createElement('div');
    d.className = 'mermaid codeblock';
    d.dataset.mmd = c.textContent;
    d.textContent = c.textContent;
    pre.replaceWith(d);
  });
  /* Fix 1: mermaid 逐个渲染（v11 batch 模式遇错会停后续节点；改每个独立 try/catch） */
  const mermaidNodes = el.querySelectorAll('.mermaid');
  let mPromise = null;
  if(window.mermaid && mermaidNodes.length){
    mPromise = (async function(){
      const ESC = function(s){ return String(s).replace(/[<>&]/g, function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];}); };
      for(let i=0; i<mermaidNodes.length; i++){
        const node = mermaidNodes[i];
        try{ await mermaid.run({nodes: [node]}); }
        catch(e){
          node.innerHTML = '<div style="color:var(--bad,#cf222e);font-size:12px;padding:8px;border:1px dashed currentColor;border-radius:6px;margin:6px 0">⚠ Mermaid 渲染失败：'+ ESC(e.message||e).substring(0,300) + '<br><pre style="margin:6px 0 0;white-space:pre-wrap;font-size:11px;color:var(--ink-3,#656d76)">'+ ESC(node.dataset.mmd||'').substring(0,400) + '</pre></div>';
        }
      }
    })();
  }
  /* hljs + 代码工具条 */
  el.querySelectorAll('pre').forEach(function(pre){
    const code = pre.querySelector('code');
    if(!code || code.classList.contains('language-mermaid')) return;
    pre.classList.add('codeblock');
    pre.dataset.src = code.textContent;
    if(window.hljs){ try{ hljs.highlightElement(code); }catch(e){} }
  });
  /* Fix 4: 表格容器化共用 addBlockTools 的 .codeblock 复制逻辑（dataset.src 存 outerHTML） */
  el.querySelectorAll('table').forEach(function(t){
    if(t.parentElement && t.parentElement.classList.contains('table-wrap')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap codeblock';
    wrap.dataset.src = t.outerHTML;
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });
  addBlockTools(el);
  if(mPromise && typeof mPromise.then === 'function'){
    mPromise.then(function(){ addBlockTools(el); }).catch(function(){});
  }
  if(window.MathJax && MathJax.typesetPromise){ try{ MathJax.typesetPromise([el]); }catch(e){} }
}
function wrapImg(im, rawUrl){
  const wrap = document.createElement('span');
  wrap.className = 'img-wrap';
  im.parentNode.insertBefore(wrap, im);
  wrap.appendChild(im);
  if(rawUrl){
    const a = document.createElement('a');
    a.className = 'img-dl';
    a.href = rawUrl + '&download=1';
    a.innerHTML = icon('download') + '下载';
    a.title = '下载图片';
    a.addEventListener('click', e=>e.stopPropagation());
    wrap.appendChild(a);
    return;
  }
  /* 外部 URL 图片：fetch + blob 下载（跨域可能失败，回退提示右键另存） */
  const extSrc = im.getAttribute('src') || '';
  if(/^https?:\/\//i.test(extSrc)){
    const a = document.createElement('a');
    a.className = 'img-dl';
    a.href = '#';
    a.innerHTML = icon('download') + '下载';
    a.title = '下载图片（跨域可能失败，失败请右键另存）';
    a.addEventListener('click', async function(e){
      e.preventDefault();
      e.stopPropagation();
      try{
        const r = await fetch(extSrc, {mode:'cors'});
        if(!r.ok) throw new Error('HTTP ' + r.status);
        const b = await r.blob();
        const url = URL.createObjectURL(b);
        const t = document.createElement('a');
        t.href = url;
        t.download = extSrc.split('/').pop().split('?')[0] || 'image';
        document.body.appendChild(t); t.click(); t.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 4000);
        toast('已下载','good',1500);
      }catch(err){
        toast('跨域下载失败，请右键图片另存', 'bad');
      }
    });
    wrap.appendChild(a);
  }
}
function addBlockTools(el){
  /* 代码块：复制 + 下载 */
  el.querySelectorAll('pre.codeblock').forEach(function(pre){
    if(pre.querySelector('.block-tools')) return;
    const tools = document.createElement('div');
    tools.className = 'block-tools';
    tools.innerHTML =
      '<button class="tbtn" data-act="copy">'+icon('copy')+'复制</button>'+
      '<button class="tbtn" data-act="dl">'+icon('download')+'</button>';
    tools.querySelector('[data-act="copy"]').addEventListener('click', ()=>copyText(pre.dataset.src || pre.textContent, '代码已复制'));
    tools.querySelector('[data-act="dl"]').addEventListener('click', ()=>{
      const blob = new Blob([pre.dataset.src || pre.textContent], {type:'text/plain'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'snippet.txt'; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    });
    pre.appendChild(tools);
  });
  /* mermaid：复制源码 + 导出 */
  el.querySelectorAll('.mermaid.codeblock').forEach(function(d){
    if(d.querySelector('.block-tools')) return;
    const tools = document.createElement('div');
    tools.className = 'block-tools';
    tools.innerHTML =
      '<button class="tbtn" data-act="copy">'+icon('copy')+'源码</button>'+
      '<button class="tbtn" data-act="exp">'+icon('download')+settings.mermaidExport.toUpperCase()+'</button>';
    tools.querySelector('[data-act="copy"]').addEventListener('click', ()=>copyText(d.dataset.mmd || '', 'Mermaid 源码已复制'));
    tools.querySelector('[data-act="exp"]').addEventListener('click', ()=>exportMermaid(d));
    d.appendChild(tools);
  });
}
async function exportMermaid(d){
  const fmt = settings.mermaidExport;
  const src = d.dataset.mmd || '';
  try{
    let svgEl = d.querySelector('svg');
    if(!svgEl && window.mermaid && mermaid.mermaidAPI){
      const res = await mermaid.mermaidAPI.getDiagramFromText(src);
      const tmp = document.createElement('div'); tmp.innerHTML = res.svg;
      svgEl = tmp.querySelector('svg');
    }
    if(!svgEl){ toast('导出失败：未找到 SVG','bad'); return; }
    const svgTxt = new XMLSerializer().serializeToString(svgEl);
    if(fmt === 'svg'){
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([svgTxt], {type:'image/svg+xml'}));
      a.download = 'diagram.svg'; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      toast('已导出 SVG','good',1800);
      return;
    }
    const img = new Image();
    img.onload = function(){
      const scale = 2;
      const canvas = document.createElement('canvas');
      const w = svgEl.viewBox && svgEl.viewBox.baseVal ? svgEl.viewBox.baseVal.width : (svgEl.width.baseVal.value || img.width);
      const h = svgEl.viewBox && svgEl.viewBox.baseVal ? svgEl.viewBox.baseVal.height : (svgEl.height.baseVal.value || img.height);
      canvas.width = w*scale; canvas.height = h*scale;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--panel') || '#fff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function(b){
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download = 'diagram.png'; a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      });
      toast('已导出 PNG','good',1800);
    };
    img.onerror = ()=>toast('PNG 导出失败','bad');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgTxt);
  }catch(e){ toast('导出失败：'+e.message,'bad'); }
}
function rerenderMermaid(){
  if(!window.mermaid) return;
  const nodes = document.querySelectorAll('.mermaid[data-mmd]');
  if(!nodes.length) return;
  nodes.forEach(d => { d.removeAttribute('data-processed'); d.textContent = d.dataset.mmd; });
  try{
    const p = mermaid.run({nodes});
    /* 切主题后 mermaid 重渲染同样会清掉按钮 → 重加 */
    if(p && typeof p.then === 'function'){
      p.then(function(){ 
        nodes.forEach(n => {
          if(n.parentElement) addBlockTools(n.parentElement);
        });
      }).catch(function(){});
    }
  }catch(e){}
}
</script>
<script>
/* ==================== 库导航（需求 6/8：chip 直搜 + 分组 + 独立显示 + 双指标） ==================== */
async function loadNav(){
  try{
    const [st, libRes] = await Promise.all([api('/api/status'), api('/api/libraries')]);
    STATUS_DOMAINS = st.domains;
    st.domains.forEach(d => DOMAIN_LABELS[d.key] = d.label);
    LIBS = libRes.libraries || [];
    FOLDERS = libRes.folders || [];
    LIBS.forEach(l => DOMAIN_LABELS[l.domain] = l.label);
    renderNav();
  }catch(e){
    $('#navBody').innerHTML = '<div class="empty"><div class="e-title">后端未连接</div><div class="e-sub">请启动 server.py<br>或 URL 加 <kbd>?mock=1</kbd> 查看演示</div></div>';
  }
}
function statusOf(domainKey){
  return STATUS_DOMAINS.find(d => d.key === domainKey) || null;
}
function cntText(domainKey){
  const s = statusOf(domainKey);
  if(!s || !s.available) return '离线';
  if(s.docs != null) return s.docs + ' 文档 · ' + (s.indexed ?? '?') + ' 段';
  return (s.indexed ?? '?') + ' 段';
}
function renderNav(){
  const body = $('#navBody');
  const grouped = new Set();
  FOLDERS.forEach(f => (f.members||[]).forEach(m => grouped.add(m)));
  const visibleLibs = LIBS.filter(l => l.slug !== 'gray' && l.enabled !== false);
  const ungrouped = visibleLibs.filter(l => !grouped.has(l.slug));
  const COLLAPSE_N = 6;
  let html = '';

  html += '<div class="nav-sec">视图</div>';
  html += navItem('all', '🌐', '全部库', state.scope==='all', '');
  html += navItem('fav', '⭐', '收藏夹', state.scope==='fav', '');

  if(FOLDERS.length){
    html += '<div class="nav-sec">分组</div>';
    FOLDERS.forEach(f=>{
      const kids = (f.members||[]).map(m => LIBS.find(l=>l.slug===m)).filter(Boolean);
      const on = kids.some(l => state.scope === l.domain);
      html += '<div class="nav-folder'+(on||f.open?' open':'')+'" data-fid="'+f.id+'">'+
        '<button class="nav-item" onclick="toggleFolder('+f.id+')">'+
          '<span class="nav-ico car">'+icon('car')+'</span>'+
          '<span class="nav-ico">'+icon('folder')+'</span>'+
          '<span class="nav-label">'+esc(f.name)+'</span>'+
          '<span class="nav-cnt">'+kids.length+'</span>'+
        '</button><div class="nav-kids">'+
        kids.map(l => navLibItem(l)).join('')+
        '</div></div>';
    });
  }

  if(ungrouped.length){
    const needCollapse = visibleLibs.length > COLLAPSE_N && ungrouped.length > 3;
    const pinned = needCollapse ? ungrouped.slice(0, 2) : ungrouped;
    const rest = needCollapse ? ungrouped.slice(2) : [];
    html += '<div class="nav-sec">库</div>';
    html += pinned.map(navLibItem).join('');
    if(rest.length){
      const otherOn = rest.some(l => state.scope === l.domain);
      html += '<div class="nav-folder'+(otherOn?' open':'')+'" data-fid="other">'+
        '<button class="nav-item" onclick="toggleFolder(\'other\')">'+
          '<span class="nav-ico car">'+icon('car')+'</span><span class="nav-ico">'+icon('folder')+'</span>'+
          '<span class="nav-label">其他</span><span class="nav-cnt">'+rest.length+'</span>'+
        '</button><div class="nav-kids">'+rest.map(navLibItem).join('')+'</div></div>';
    }
  }
  body.innerHTML = html;
}
function navItem(key, ico, label, on, cnt){
  return '<button class="nav-item'+(on?' on':'')+'" onclick="setScope(\''+key+'\')">'+
    '<span class="nav-ico">'+ico+'</span><span class="nav-label">'+esc(label)+'</span>'+
    (cnt?'<span class="nav-cnt">'+cnt+'</span>':'')+'</button>';
}
function navLibItem(l){
  const on = state.scope === l.domain;
  const weeklyExtra = l.slug==='weekly' && on
    ? '' : '';
  return '<button class="nav-item'+(on?' on':'')+'" onclick="setScope(\''+l.domain+'\')">'+
    '<span class="dot" style="background:'+libColor(l.slug)+'"></span>'+
    '<span class="nav-ico">'+(l.icon||'📁')+'</span>'+
    '<span class="nav-label">'+esc(l.label)+'</span>'+
    '<span class="nav-cnt">'+cntText(l.domain)+'</span></button>';
}
function toggleFolder(fid){
  const el = document.querySelector('.nav-folder[data-fid="'+fid+'"]');
  if(el) el.classList.toggle('open');
  const f = FOLDERS.find(x => String(x.id) === String(fid));
  if(f) f.open = !f.open;
}

/* 选中库 = 进入该库工作台（chip 直搜的 v3 形态） */
async function setScope(scope){
  state.scope = scope;
  state.genre = '';
  document.body.classList.remove('nav-open');
  if(scope === 'fav'){ showFavorites(); renderNav(); return; }
  renderNav();
  updateWsTitle();
  await loadGenreChips();
  $('#q').value = '';
  doSearch();
}
function updateWsTitle(){
  const t = state.scope==='all' ? '全部库' : domainLabel(state.scope);
  $('#wsTitle').textContent = t + ' · 工作台';
  $('#q').placeholder = state.scope==='all' ? '搜索全部库（留空回车 = 浏览最近）' : '搜索「'+t+'」（留空回车 = 浏览最近）';
}
async function loadGenreChips(){
  const box = $('#wsGenres');
  if(state.scope==='all' || state.scope==='fav'){ box.innerHTML=''; return; }
  try{
    if(!state.genresByDomain[state.scope]){
      const g = await api('/api/genres?domain=' + encodeURIComponent(state.scope));
      state.genresByDomain[state.scope] = g;
    }
    const entry = state.genresByDomain[state.scope];
    const key = Object.keys(entry || {})[0];
    const genres = key ? entry[key].genres : [];
    let html = '';
    if(state.scope==='weekly'){
      html += '<button class="genre-chip'+(state.genre==='周报正文'?' on':'')+'" onclick="setGenre(\'周报正文\')" title="仅周报正文（4 篇周报文件）">📄 纯周报</button>';
    }
    genres.forEach(g=>{
      if(state.scope==='weekly' && g.genre==='周报正文') return; // 已有专用按钮
      html += '<button class="genre-chip'+(state.genre===g.genre?' on':'')+'" onclick="setGenre(\''+esc(g.genre)+'\')">'+esc(g.genre)+' <span class="num">'+g.docs+'</span></button>';
    });
    box.innerHTML = html;
  }catch(e){ box.innerHTML=''; }
}
function setGenre(g){
  state.genre = (state.genre === g) ? '' : g;
  loadGenreChips();
  $('#q').value = '';
  doSearch();
}
function searchGenre(domain, genre){
  state.scope = domain;
  state.genre = genre;
  renderNav(); updateWsTitle(); loadGenreChips();
  $('#q').value = '';
  doSearch();
}

/* ==================== 搜索（保留 v2 全部筛选能力） ==================== */
function onTimeChange(){ $('#dates').style.display = ($('#time').value==='custom') ? '' : 'none'; }
function timeRange(){
  const t = $('#time').value;
  if(t==='all') return {since:null, until:null};
  if(t==='custom'){
    const s=$('#since_date').value, u=$('#until_date').value;
    return {since: s?new Date(s).getTime():null, until: u?new Date(u).getTime()+86400000-1:null};
  }
  const days = parseInt(t);
  return {since: Date.now()-days*86400000, until:null};
}
function skeletonHtml(n){ let s=''; for(let i=0;i<n;i++) s+='<div class="sk"><i style="width:38%"></i><i style="width:72%"></i><i style="width:60%"></i></div>'; return s; }
function setWsHead(title, showBack){ $('#wsTitle').textContent = title; $('#wsBack').style.display = showBack?'':'none'; }
function backToResults(){ state.view='results'; $('#wsBack').style.display='none'; updateWsTitle(); renderResults(); }

async function doSearch(){
  const q = $('#q').value.trim();
  const tr = timeRange();
  const dom = state.scope==='all' || state.scope==='fav' ? 'all' : state.scope;
  let url = '/api/search?q=' + encodeURIComponent(q) + '&domain=' + encodeURIComponent(dom);
  if(tr.since!=null) url += '&since='+tr.since;
  if(tr.until!=null) url += '&until='+tr.until;
  const notq = $('#notq').value.trim();
  if(notq) url += '&not=' + encodeURIComponent(notq);
  if(state.genre) url += '&genre=' + encodeURIComponent(state.genre);

  state.view = 'results';
  $('#wsBack').style.display = 'none';
  updateWsTitle();
  $('#results').innerHTML = skeletonHtml(4);
  $('#wsMeta').textContent = '搜索中…';
  try{
    const d = await api(url);
    state.hits = (d.hits||[]).map(h=>({h, gray:false})).concat((d.gray_hits||[]).map(h=>({h, gray:true})));
    state.searchMeta = d;
    state.kbIdx = -1;
    state.searchedOnce = true;
    renderResults();
  }catch(e){
    $('#wsMeta').textContent = '';
    $('#results').innerHTML = emptyHtml('inbox','搜索失败','无法连接后端 /api/search。<br>请确认 server.py 已启动，或 URL 加 <kbd>?mock=1</kbd> 看演示。');
  }
}
function renderResults(){
  const box = $('#results'), d = state.searchMeta || {};
  if(!state.hits.length){
    $('#wsMeta').textContent = state.searchedOnce ? '0 文档' : '';
    box.innerHTML = state.searchedOnce
      ? emptyHtml('search','未命中','换个关键词或减少筛选条件试试。'+(d.offline&&d.offline.length?'<br>（'+esc(d.offline.join('、'))+' 离线，已跳过）':''))
      : emptyHtml('search','搜索你的知识库','左侧点库进入工作台；输入关键词（多词空格分隔）<br>或直接回车按时间倒序浏览最近文档',['周报 多模态','FTS5','校准']);
    return;
  }
  let html = '';
  if(d.used_gray_fallback) html += '<div class="notice">⚠ active 域全空，已回退查灰库</div>';
  state.hits.forEach(({h, gray}, i)=>{
    const fav = h.badge && h.badge.is_favorite;
    html += '<div class="hit'+(i===state.kbIdx?' sel':'')+'" data-i="'+i+'" onclick="hitClick('+i+')">'+
      '<span class="hit-top">'+
        '<span class="tag '+domTagClass(h.domain)+'">'+esc(h.domain_label || domainLabel(h.domain))+'</span>'+
        (h.genre ? '<button class="genre-chip" onclick="event.stopPropagation();searchGenre(\''+esc(h.domain)+'\',\''+esc(h.genre)+'\')" title="列出全部「'+esc(h.genre)+'」">'+esc(h.genre)+'</button>' : '')+
        badgeHtml(h.badge)+
        (h.matched ? '<span class="hit-matched" title="该条命中的搜索共识词数，用于排序">命中 '+h.matched+' 词</span>' : '')+
        '<button class="hit-fav'+(fav?' on':'')+'" data-i="'+i+'" onclick="event.stopPropagation();toggleFavHit('+i+',this)" title="'+(fav?'取消收藏':'收藏')+'">'+icon(fav?'starFill':'star')+'</button>'+
      '</span>'+
      '<span class="hit-title">'+esc(h.title)+'</span>'+
      '<span class="hit-sub">'+esc(h.sub)+'</span>'+
      '<span class="hit-snip">'+esc(h.snippet)+'</span>'+
    '</div>';
  });
  box.innerHTML = html;
  $('#wsMeta').textContent = state.hits.length + ' 文档';
}
function emptyHtml(ic, title, sub, tips){
  let s = '<div class="empty">'+iconLg(ic)+'<div class="e-title">'+title+'</div><div class="e-sub">'+sub+'</div>';
  if(tips && tips.length) s += '<div class="e-tips">试试：'+tips.map(t=>'<button class="chip" onclick="quickSearch(\''+esc(t)+'\')">'+esc(t)+'</button>').join('')+'</div>';
  return s + '</div>';
}
function quickSearch(t){ $('#q').value = t; doSearch(); }
function hitClick(i){
  selectHit(i);
  const it = state.hits[i];
  if(!it) return;
  const hit = it.h;
  if(settings.expandMode==='whole') whole(hit.unit_id, hit.domain==='conversation'?'session':'document');
  else expand(hit.ref_id, it.gray, hit);
}
function selectHit(i){
  state.kbIdx = i;
  document.querySelectorAll('#results .hit').forEach(el => el.classList.toggle('sel', +el.dataset.i===i));
  const el = document.querySelector('#results .hit[data-i="'+i+'"]');
  if(el) el.scrollIntoView({block:'nearest'});
}

/* ==================== 收藏（需求 5） ==================== */
async function toggleFav(domain, unitId, btnEl){
  try{
    const r = await post('/api/favorite', {domain, unit_id:unitId});
    if(r.is_favorite == null) throw new Error(r.err || '未知响应');
    if(btnEl){
      btnEl.classList.toggle('on', !!r.is_favorite);
      btnEl.innerHTML = icon(r.is_favorite ? 'starFill' : 'star');
      btnEl.title = r.is_favorite ? '取消收藏' : '收藏';
    }
    toast(r.is_favorite ? '已收藏' : '已取消收藏', r.is_favorite?'good':'info', 1600);

<script>
/* ==================== 详情（需求 1/2/9/12） ==================== */
function detailSkeleton(){
  $('#detail').innerHTML = '<div style="padding:14px">'+skeletonHtml(3)+'</div>';
  $('#detailMeta').textContent = '加载中…';
}
function closeDetail(){ document.body.classList.remove('detail-open'); }

async function expand(id, isGray, hit){

    cur = {domain:d.domain, unit_id:d.unit_id, title:d.title, ref_id:id,
           isGray:!!(d.isGray||isGray), genre:d.genre||(hit&&hit.genre)||'',
           file_path:d.file_path || (hit && parseFilePath(hit.sub)) || null};
    showDetail(d, false);
    loadSiblings(d.unit_id);
  }catch(e){ $('#detail').innerHTML = emptyHtml('err','加载失败','无法连接 /api/expand。'); $('#detailMeta').textContent=''; }
}
async function whole(id, kind){
  document.body.classList.add('detail-open');
  detailSkeleton();
  try{
    const d = await api('/api/whole?id=' + encodeURIComponent(id) + '&kind=' + kind);
    if(d.err){ $('#detail').innerHTML = '<div class="empty">'+esc(d.err)+'</div>'; return; }
    cur = {domain:d.domain, unit_id:d.unit_id, title:d.title, ref_id:(cur&&cur.ref_id)||id,
           isGray:!!d.isGray, genre:d.genre||'',
           file_path:d.file_path || (cur && cur.file_path) || null};
    showDetail(d, true);
    loadSiblings(d.unit_id);
  }catch(e){ $('#detail').innerHTML = emptyHtml('err','加载失败','无法连接 /api/whole。'); $('#detailMeta').textContent=''; }
}
/* 从 hit.sub（"周报 / 20260803-0809/周报.md › …"）解析 file_path */
function parseFilePath(sub){
  if(!sub) return null;
  const m = /\/\s*([^›]+\.(?:md|markdown|txt))/i.exec(sub);
  return m ? m[1].trim() : null;
}

function rawUrlOf(domain, path, download){
  let p = path;
  try{ p = decodeURIComponent(path); }catch(e){}
  /* v3 fix: 相对路径（./ 或 ../ 或裸文件名）按当前 doc 的 file_path 解析。
     marked 给的 src 是相对 md 文件所在目录的，必须 join 后才能命中 source_root 子树。 */
  if(p && !/^https?:\/\//i.test(p) && !p.startsWith('data:') && (p.startsWith('./') || p.startsWith('../') || (p.indexOf('/') < 0))){
    const base = (cur && cur.file_path) ? cur.file_path : (renderFilePath || '');
    if(base){
      const dir = base.lastIndexOf('/') >= 0 ? base.substring(0, base.lastIndexOf('/')) : '';
      let resolved = dir ? (dir + '/' + p) : p;
      const parts = resolved.split('/');
      const out = [];
      for(let i=0; i<parts.length; i++){
        const part = parts[i];
        if(part === '..'){ out.pop(); }
        else if(part !== '.' && part !== ''){ out.push(part); }
      }
      p = out.join('/');
    }
  }
  return '/api/raw?domain='+encodeURIComponent(domain)+'&path='+encodeURIComponent(p)+(download?'&download=1':'');
}
function rawUrl(domain, path, download){ return rawUrlOf(domain, path, download); }
function showDetail(d, isWhole){
  renderDomain = d.domain;   // 图片重写的域上下文（随 doc 切换）

  const dlPath = cur.file_path;

  const convRawPath = cur.domain==='conversation' ? cur.unit_id : dlPath;

  let head = '<div class="dt-sticky">'+
    '<div class="dt-title-row">'+
      '<span class="tag '+domTagClass(d.domain)+'">'+esc(domainLabel(d.domain))+'</span>'+

      '<h3 class="dt-title">'+esc(d.title)+'</h3>'+
      (cur.isGray ? '<span class="dt-pill gray">'+icon('archive')+'灰库中</span>' : '')+
      (d.multimodal_url ? '<a class="dt-pill" href="'+esc(d.multimodal_url)+'" target="_blank" rel="noopener">'+icon('ext')+'多模态展示（kimi）</a>' : '')+
    '</div>'+
    '<div class="dt-actions">'+
      '<span class="seg">'+
        '<button class="btn" onclick="rate(\'useful\')" title="这条对我有用">'+icon('thumbUp')+'有用</button>'+
        '<button class="btn" onclick="rate(\'stale\')" title="内容已过时">'+icon('clock')+'过时</button>'+
        '<button class="btn" onclick="rate(\'wrong\')" title="内容有错误">'+icon('xCircle')+'错误</button>'+
      '</span>'+
      '<span class="sep"></span>'+
      '<button id="favBtn" class="btn'+(fav?' fav-on':'')+'" onclick="toggleFavDetail(this)">'+icon(fav?'starFill':'star')+(fav?'已收藏':'收藏')+'</button>'+
      '<button class="btn" onclick="openIssueModal()">'+icon('plus')+'挂 issue</button>'+
      '<button class="btn" onclick="viewIssues()">'+icon('flag')+'看 issue</button>'+
      (isWhole ? '' : '<button class="btn" onclick="whole(\''+esc(cur.unit_id)+'\',\''+wholeKind+'\')">'+icon('doc')+'看全文</button>')+
      (canRaw && convRawPath ? '<a class="btn" href="'+rawUrl(cur.domain, convRawPath, 1)+'" title="下载原始 markdown">'+icon('download')+'原 md</a>' : '')+
      (cur.isGray
        ? '<button class="btn danger" onclick="reviveFromDetail(this)">'+icon('undo')+'恢复到 active</button>'
        : (cur.domain && cur.domain.startsWith('project:')
            ? '<button class="btn danger" onclick="evict(this)">'+icon('archive')+'移入灰库</button>' : ''))+
    '</div>'+
  '</div>';
  let body = '<div class="dt-md">';
  if(d.badge && d.badge.errata && d.badge.errata.length){
    d.badge.errata.forEach(e=>{
      body += '<div class="callout">⚠ <b>勘误</b>：'+esc(e.note)+'<span class="when">'+fmtTs(e.ts)+'</span></div>';
    });
  }
  body += '<div class="mdhost markdown-body" id="mdhost"></div></div>';
  body += '<div class="sib-sec" id="sibSec" style="display:none"></div>';
  $('#detail').innerHTML = head + body;
  $('#detailMeta').textContent = isWhole ? '全文' : '片段';
  $('#detail').scrollTop = 0;
  renderMd(d.md, $('#mdhost'));
}
function toggleFavDetail(btn){
  if(!cur) return;
  toggleFav(cur.domain, cur.unit_id, null).then(isFav=>{
    if(isFav==null) return;
    btn.classList.toggle('fav-on', !!isFav);
    btn.innerHTML = icon(isFav?'starFill':'star') + (isFav?'已收藏':'收藏');
  });
}

/* 需求 12：关联文件面板 */
async function loadSiblings(docId){
  try{
    const s = await api('/api/siblings?doc_id=' + encodeURIComponent(docId));
    renderSiblings(s);
    /* 若 expand/whole 未给 file_path，用 same_folder 中指向自身的记录补齐 */
    if(cur && !cur.file_path){
      const me = (s.same_folder||[]).concat(s.week_mate||[]).find(x => x.doc_id === docId);
      if(me && me.file_path) cur.file_path = me.file_path;
    }
  }catch(e){ /* siblings 静默失败，不影响正文 */ }
}
function renderSiblings(s){
  const sec = $('#sibSec');
  if(!sec || !cur) return;
  const peers = (s.same_folder||[]).concat(s.week_mate||[]).filter(x => x.doc_id !== cur.unit_id);
  const imgs = s.referenced_images || [];
  if(!peers.length && !imgs.length){ sec.style.display='none'; return; }
  let html = '<h4>📎 关联文件</h4>';
  if(peers.length){
    peers.forEach(p=>{
      html += '<div class="sib-item" onclick="whole(\''+esc(p.doc_id)+'\',\'document\')">'+icon('doc')+'<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.title||p.file_path)+'</span><span style="color:var(--ink-3);font-size:11px">'+esc(p.file_path||'')+'</span></div>';
    });
  }
  if(imgs.length){
    html += '<div class="sib-thumbs" style="margin-top:8px">';
    imgs.forEach(im=>{
      const url = rawUrl(cur.domain, im.resolved_path, 0);
      html += '<div class="sib-thumb"><img src="'+url+'" loading="lazy" alt="'+esc(im.ref)+'">'+
        '<span title="'+esc(im.ref)+'">'+esc(im.ref.split('/').pop())+'</span>'+
        '<a href="'+url+'&download=1" title="下载">'+icon('download')+'</a></div>';
    });
    html += '</div>';
  }
  sec.innerHTML = html;
  sec.style.display = '';
}

/* ==================== 打分 / issue / 灰库（保留 v2，alert/prompt → toast/modal） ==================== */
async function rate(verdict){
  if(!cur) return;
  const NAMES = {useful:'有用', stale:'过时', wrong:'错误'};
  try{
    const r = await post('/api/rate', {domain:cur.domain, unit_id:cur.unit_id, verdict});
    if(r.ok){ toast('已记录「'+NAMES[verdict]+'」· 当前 rank '+r.rank.score,'good'); }
    else toast('评分失败：'+esc(r.err||'未知错误'),'bad');
  }catch(e){ toast('请求失败：'+e.message,'bad'); }
}
function openIssueModal(){
  if(!cur) return;
  $('#modalRoot').innerHTML =
    '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog">'+
      '<h3>挂 issue</h3>'+
      '<p class="modal-sub">针对「'+esc(cur.title)+'」——记录哪里需要修正/补充。issue 挂在原位置，<b>不改原文</b>。</p>'+
      '<textarea id="issueNote" placeholder="例如：第二节的参数表已过时…"></textarea>'+
      '<div class="hint">Ctrl + Enter 提交 · Esc 取消</div>'+

async function submitIssue(){

    const r = await post('/api/issue', {domain:cur.domain, unit_id:cur.unit_id, note});

async function viewIssues(){

async function closeIssue(id){

    if(r.ok){ toast('issue 已关闭','good'); if(state.view==='issues') allIssues(); else if(cur) viewIssues(); }
    else toast('关闭失败：'+esc(r.err||''),'bad');
  }catch(e){ toast('请求失败：'+e.message,'bad'); }
}
function twoStepBtn(btn, label, fn){
  if(!btn) return;
  if(btn.dataset.armed){
    delete btn.dataset.armed; btn.classList.remove('armed');
    if(btn.dataset.orig){ btn.innerHTML = btn.dataset.orig; delete btn.dataset.orig; }
    clearTimeout(window._tsTimer); fn(); return;
  }
  btn.dataset.armed='1'; btn.dataset.orig = btn.innerHTML;
  btn.innerHTML = '再点确认 · '+label; btn.classList.add('armed');
  clearTimeout(window._tsTimer);
  window._tsTimer = setTimeout(()=>{
    delete btn.dataset.armed;
    if(btn.dataset.orig){ btn.innerHTML = btn.dataset.orig; delete btn.dataset.orig; }
    btn.classList.remove('armed');
  }, 3500);
}
async function evict(btn){

async function reviveFromDetail(btn){

async function revive(domain, docId, btn){

      if(r.ok){ toast('已恢复到 active','good'); showGray(); }
      else toast('失败：'+esc(r.err||''),'bad');

async function allIssues(){

        '<span class="tag '+domTagClass(i.domain)+'">'+esc(domainLabel(i.domain))+'</span> '+esc(i.note)+
        '<span class="when">'+fmtTs(i.opened_ts)+' · <a class="lnk" onclick="event.stopPropagation();closeIssue('+i.id+')">关闭</a></span></div>';

    $('#results').innerHTML = html;
  }catch(e){ $('#results').innerHTML = emptyHtml('err','加载失败','无法连接 /api/issues。'); $('#wsMeta').textContent=''; }

<script>
/* ==================== 需求 7：新建库 / 库管理 ==================== */
let newLibTags = [];
function openNewLibrary(){
  newLibTags = [];
  $('#modalRoot').innerHTML =
  '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog">'+
    '<h3>新建库</h3>'+
    '<p class="modal-sub">新建一个知识库域（<code>project:&lt;slug&gt;</code>）。后端会自动写配置、初始化索引并做首次同步。</p>'+
    '<div class="fld-row"><label>slug <span class="fld-sub">英文短名，必填（/^[a-z][a-z0-9_]*$/）</span></label><input type="text" id="nlSlug" placeholder="如 searchlight"></div>'+
    '<div class="fld-row"><label>显示名 <span class="fld-sub">必填</span></label><input type="text" id="nlLabel" placeholder="如 探照灯认知"></div>'+
    '<div class="fld-row"><label>介绍</label><textarea id="nlDesc" placeholder="这个库装什么？"></textarea></div>'+
    '<div class="fld-row"><label>标签 <span class="fld-sub">回车添加</span></label><div class="tagbox" id="nlTagBox" onclick="this.querySelector(\'input\').focus()"><input type="text" placeholder="学习 / 工作 …"></div></div>'+
    '<div class="fld-row"><label>图标 <span class="fld-sub">emoji 或留空</span></label><input type="text" id="nlIcon" placeholder="📦" style="width:90px"></div>'+
    '<div class="fld-row"><label>源目录 <span class="fld-sub">必填，本地绝对路径，如 D:/notes/searchlight</span></label><input type="text" id="nlRoot" placeholder="D:/..."></div>'+
    '<details class="adv"><summary>高级选项（索引规则）</summary><div class="adv-body">'+
      '<div class="fld-row"><label>index_globs</label><input type="text" id="nlIndexGlobs" value="**/*.md"></div>'+
      '<div class="fld-row"><label>store_only_globs</label><input type="text" id="nlStoreGlobs" placeholder="留空 = 不额外存储"></div>'+
      '<div class="fld-row"><label>exclude_globs</label><input type="text" id="nlExcludeGlobs" placeholder="如 **/.obsidian/**"></div>'+
    '</div></details>'+
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitNewLibrary()">创建并同步</button></div>'+
  '</div></div>';
  const ti = $('#nlTagBox input');
  ti.addEventListener('keydown', e=>{
    if(e.key==='Enter' && ti.value.trim()){ newLibTags.push(ti.value.trim()); ti.value=''; renderNewLibTags(); e.preventDefault(); }
    else if(e.key==='Backspace' && !ti.value && newLibTags.length){ newLibTags.pop(); renderNewLibTags(); }
  });

}
function renderNewLibTags(){
  const box = $('#nlTagBox');
  box.querySelectorAll('.tchip').forEach(c=>c.remove());
  newLibTags.forEach((t,i)=>{
    const c = document.createElement('span');
    c.className='tchip'; c.innerHTML = esc(t)+' <b onclick="newLibTags.splice('+i+',1);renderNewLibTags()">×</b>';
    box.insertBefore(c, box.querySelector('input'));
  });
}
async function submitNewLibrary(){
  const slug = $('#nlSlug').value.trim();
  const label = $('#nlLabel').value.trim();
  const root = $('#nlRoot').value.trim();
  if(!/^[a-z][a-z0-9_]*$/.test(slug)){ toast('slug 须匹配 /^[a-z][a-z0-9_]*$/','bad'); return; }
  if(!label){ toast('显示名必填','bad'); return; }
  if(!root){ toast('源目录必填','bad'); return; }
  const payload = {
    slug, label,
    description: $('#nlDesc').value.trim(),
    tags: newLibTags.slice(),
    icon: $('#nlIcon').value.trim() || '📁',
    source_root: root
  };
  const ig = $('#nlIndexGlobs').value.trim(); if(ig) payload.index_globs = ig;
  const sg = $('#nlStoreGlobs').value.trim(); if(sg) payload.store_only_globs = sg;
  const eg = $('#nlExcludeGlobs').value.trim(); if(eg) payload.exclude_globs = eg;
  try{
    const r = await post('/api/library', payload);
    if(r.ok){
      closeModal();
      const s = r.initial_sync || {};
      toast('库「'+label+'」已创建，首次同步 '+(s.indexed??0)+' 段 / '+(s.files??0)+' 文件','good', 5000);
      await loadNav();
      setScope('project:'+slug);
    }else toast('创建失败：'+esc(r.err||'未知错误'),'bad');
  }catch(e){ toast('请求失败：'+e.message,'bad'); }
}
function openLibManager(){
  $('#modalRoot').innerHTML =
  '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" style="width:min(640px,100%)">'+
    '<h3>库管理</h3><p class="modal-sub">编辑元信息、删除库（可选保留 db）。每次打开实时拉取。</p>'+
    '<input type="text" id="libFilter" placeholder="过滤库名 / slug / 标签…" style="width:100%;margin-bottom:10px" oninput="renderLibRows(this.value.trim())">'+
    '<div id="libRows"><div class="empty">加载中…</div></div>'+
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button></div>'+
  '</div></div>';
  api('/api/libraries').then(d=>{
    LIBS = d.libraries || LIBS;
    FOLDERS = d.folders || FOLDERS;
    renderLibRows('');
  }).catch(e=>{ $('#libRows').innerHTML = '<div class="empty">加载失败：'+esc(e.message)+'</div>'; });
}
function renderLibRows(filter){
  let list = LIBS.slice();
  if(filter){
    const f = filter.toLowerCase();
    list = list.filter(l => (l.label||'').toLowerCase().includes(f) || (l.slug||'').toLowerCase().includes(f) || (l.tags||[]).join(' ').toLowerCase().includes(f));
  }
  if(!list.length){ $('#libRows').innerHTML = '<div class="empty">无匹配库</div>'; return; }
  $('#libRows').innerHTML = list.map(l=>
    '<div class="lib-row">'+
      '<span class="nav-ico">'+(l.icon||'📁')+'</span>'+
      '<div class="lr-label"><b>'+esc(l.label)+'</b> <span style="color:var(--ink-3)">'+esc(l.slug)+(l.builtin?' · 内置':'')+'</span>'+
      '<span>'+esc(l.description||'')+'</span></div>'+
      (l.builtin ? '<span style="font-size:11px;color:var(--ink-3)">内置库</span>'
        : '<button class="btn" onclick="editLibrary(\''+esc(l.slug)+'\')">编辑</button>'+
          '<button class="btn danger" onclick="deleteLibrary(\''+esc(l.slug)+'\',\''+esc(l.label)+'\',this)">删除</button>')+
    '</div>').join('');
}
function editLibrary(slug){
  const l = LIBS.find(x=>x.slug===slug); if(!l) return;
  newLibTags = (l.tags||[]).slice();
  $('#modalRoot').innerHTML =
  '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog">'+
    '<h3>编辑库 · '+esc(l.label)+'</h3>'+
    '<div class="fld-row"><label>显示名</label><input type="text" id="elLabel" value="'+esc(l.label||'')+'"></div>'+
    '<div class="fld-row"><label>介绍</label><textarea id="elDesc">'+esc(l.description||'')+'</textarea></div>'+
    '<div class="fld-row"><label>标签 <span class="fld-sub">回车添加</span></label><div class="tagbox" id="nlTagBox" onclick="this.querySelector(\'input\').focus()"><input type="text"></div></div>'+
    '<div class="fld-row"><label>图标</label><input type="text" id="elIcon" value="'+esc(l.icon||'📁')+'" style="width:90px"></div>'+
    '<div class="modal-actions"><button class="btn" onclick="openLibManager()">返回</button><button class="btn primary" onclick="submitEditLibrary(\''+esc(slug)+'\')">保存</button></div>'+
  '</div></div>';
  renderNewLibTags();
  const ti = $('#nlTagBox input');
  ti.addEventListener('keydown', e=>{
    if(e.key==='Enter' && ti.value.trim()){ newLibTags.push(ti.value.trim()); ti.value=''; renderNewLibTags(); e.preventDefault(); }
    else if(e.key==='Backspace' && !ti.value && newLibTags.length){ newLibTags.pop(); renderNewLibTags(); }
  });
}
async function submitEditLibrary(slug){
  try{
    const r = await post('/api/library/update', {
      slug, label:$('#elLabel').value.trim(), description:$('#elDesc').value.trim(),
      tags:newLibTags.slice(), icon:$('#elIcon').value.trim()||'📁'
    });
    if(r.ok){ toast('已保存','good'); await loadNav(); openLibManager(); }
    else toast('保存失败：'+esc(r.err||''),'bad');
  }catch(e){ toast('请求失败：'+e.message,'bad'); }
}
function deleteLibrary(slug, label, btn){
  twoStepBtn(btn, '删除库', async ()=>{
    $('#modalRoot').innerHTML =
    '<div class="overlay"><div class="modal" role="dialog">'+
      '<h3>删除库「'+esc(label)+'」？</h3>'+
      '<p class="modal-sub">仅从知识库移除该域，<b>源目录文件不受影响</b>。</p>'+
      '<label style="display:flex;align-items:center;gap:8px;font-size:13px"><input type="checkbox" id="dlKeepDb" checked> 保留 db 文件（以后可重新挂载）</label>'+
      '<div class="modal-actions"><button class="btn" onclick="openLibManager()">取消</button><button class="btn danger" onclick="confirmDeleteLibrary(\''+esc(slug)+'\')">确认删除</button></div>'+
    '</div></div>';
  });
}
async function confirmDeleteLibrary(slug){
  try{
    const r = await post('/api/library/delete', {slug, keep_db:$('#dlKeepDb').checked});
    if(r.ok){ toast('库已删除'+(r.db_deleted?'（db 已删）':'（db 保留）'),'good'); closeModal(); await loadNav(); if(state.scope==='project:'+slug) setScope('all'); }
    else toast('删除失败：'+esc(r.err||''),'bad');
  }catch(e){ toast('请求失败：'+e.message,'bad'); }
}

/* ==================== 设置界面（需求 3 + 分组管理） ==================== */
function openSettings(){
  $('#modalRoot').innerHTML =
  '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" style="width:min(620px,100%)">'+
    '<h3>设置</h3>'+
    '<div class="settings-sec"><h4>外观</h4>'+
      '<div class="settings-row"><div class="sr-label">主题<span class="sr-sub">跟随系统 / 亮色 / 暗色 三态循环</span></div><button class="btn" onclick="cycleTheme();openSettings()">'+themeLabel()+'</button></div>'+
      '<div class="settings-row"><div class="sr-label">库导航<span class="sr-sub">快捷键 [ 切换</span></div><button class="btn" onclick="toggleNav();openSettings()">'+(settings.navHidden?'已隐藏':'显示中')+'</button></div>'+
    '</div>'+
    '<div class="settings-sec"><h4>阅读</h4>'+
      '<div class="settings-row"><div class="sr-label">Mermaid 默认导出格式</div>'+
        '<span class="selwrap"><select id="setMmdFmt"><option value="png">PNG</option><option value="svg">SVG</option></select></span></div>'+
      '<div class="settings-row"><div class="sr-label">点结果默认打开</div>'+
        '<span class="selwrap"><select id="setExpandMode"><option value="segment">片段（expand）</option><option value="whole">全文（whole）</option></select></span></div>'+
    '</div>'+
    '<div class="settings-sec"><h4>库分组</h4><div id="folderRows"></div>'+
      '<div style="display:flex;gap:6px;margin-top:8px"><input type="text" id="newFolderName" placeholder="新分组名" style="flex:1"><button class="btn" onclick="createFolder()">＋ 建分组</button></div></div>'+
    '<div class="settings-sec"><h4>库</h4>'+
      '<div class="settings-row"><div class="sr-label">库管理<span class="sr-sub">编辑 / 删除 / 元信息</span></div><button class="btn" onclick="openLibManager()">打开</button></div></div>'+
    '<div class="settings-sec"><h4>快捷键</h4><div class="kbd-grid">'+
      '<div><kbd>/</kbd> 聚焦搜索</div><div><kbd>Esc</kbd> 关闭 / 失焦</div><div><kbd>↑</kbd><kbd>↓</kbd> 切换结果</div>'+
      '<div><kbd>Enter</kbd> 打开选中</div><div><kbd>[</kbd> 库导航显隐</div>'+
    '</div></div>'+
    '<div class="modal-actions"><button class="btn primary" onclick="closeModal()">完成</button></div>'+
  '</div></div>';
  $('#setMmdFmt').value = settings.mermaidExport;
  $('#setExpandMode').value = settings.expandMode;
  $('#setMmdFmt').addEventListener('change', e=>{ settings.mermaidExport = e.target.value; saveSettings(); toast('Mermaid 默认导出 → '+e.target.value.toUpperCase(),'good',1500); });
  $('#setExpandMode').addEventListener('change', e=>{ settings.expandMode = e.target.value; saveSettings(); });
  renderFolderRows();
}
function themeLabel(){
  const m = document.documentElement.dataset.themeMode;
  return m==='auto' ? '跟随系统' : m==='light' ? '亮色' : '暗色';
}
function renderFolderRows(){
  const box = $('#folderRows');
  if(!FOLDERS.length){ box.innerHTML = '<div style="font-size:12px;color:var(--ink-3);padding:4px 0">暂无分组。建一个，把库拖进逻辑分组。</div>'; return; }
  box.innerHTML = FOLDERS.map(f=>{
    const kids = (f.members||[]).map(m => LIBS.find(l=>l.slug===m)).filter(Boolean);
    return '<div class="lib-row"><span class="nav-ico">'+icon('folder')+'</span>'+
      '<div class="lr-label"><b>'+esc(f.name)+'</b><span>'+(kids.map(k=>esc(k.label)).join('、')||'空分组')+'</span></div>'+
      '<span class="selwrap"><select onchange="folderAddMember('+f.id+',this)"><option value="">＋ 加入库…</option>'+
        LIBS.filter(l=>l.slug!=='gray' && !(f.members||[]).includes(l.slug)).map(l=>'<option value="'+esc(l.slug)+'">'+esc(l.label)+'</option>').join('')+
      '</select></span>'+
      (kids.length?'<button class="btn" title="移出最后一个成员" onclick="folderRemoveMember('+f.id+',\''+esc(kids[kids.length-1].slug)+'\')">移出</button>':'')+
      '<button class="btn danger" onclick="deleteFolder('+f.id+',this)">删除</button></div>';
  }).join('');
}
async function createFolder(){
  const name = $('#newFolderName').value.trim();
  if(!name){ toast('分组名不能为空','bad'); return; }
  try{
    const f = await post('/api/folder', {name, parent_id:null});
    FOLDERS.push(f);
    renderFolderRows(); renderNav();
    toast('分组「'+name+'」已建','good',1500);
  }catch(e){ toast('创建失败：'+e.message,'bad'); }
}
async function folderAddMember(fid, sel){
  const slug = sel.value; if(!slug) return;
  try{
    await post('/api/folder/member', {folder_id:fid, slug});
    const f = FOLDERS.find(x=>x.id===fid);
    if(f){ f.members = f.members||[]; f.members.push(slug); }
    renderFolderRows(); renderNav();
    toast('已加入分组','good',1500);
  }catch(e){ toast('操作失败：'+e.message,'bad'); }
}
async function folderRemoveMember(fid, slug){
  try{
    await post('/api/folder/member/remove', {folder_id:fid, slug});
    const f = FOLDERS.find(x=>x.id===fid);
    if(f) f.members = (f.members||[]).filter(m=>m!==slug);
    renderFolderRows(); renderNav();
  }catch(e){ toast('操作失败：'+e.message,'bad'); }
}
function deleteFolder(fid, btn){
  twoStepBtn(btn, '删分组', async ()=>{
    try{
      await post('/api/folder/delete', {folder_id:fid});
      FOLDERS = FOLDERS.filter(x=>x.id!==fid);
      renderFolderRows(); renderNav();
      toast('分组已删（库本身保留）','good');
    }catch(e){ toast('删除失败：'+e.message,'bad'); }
  });
}

/* ==================== 主题（三态循环，同 v2） ==================== */
const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function updateThemeBtn(){
  const mode = document.documentElement.dataset.themeMode;
  const eff = document.documentElement.dataset.theme;
  const btn = $('#themeBtn');
  btn.innerHTML = icon(mode==='auto' ? 'auto' : eff==='dark' ? 'moon' : 'sun');
  btn.title = mode==='auto' ? '主题：跟随系统（当前'+(eff==='dark'?'暗':'亮')+'）· 点击切亮色'
            : mode==='light' ? '主题：亮色 · 点击切暗色' : '主题：暗色 · 点击恢复跟随系统';
}
function applyTheme(mode){
  const eff = mode==='auto' ? (mq && mq.matches ? 'dark' : 'light') : mode;
  document.documentElement.dataset.themeMode = mode;
  document.documentElement.dataset.theme = eff;
  try{
    if(mode==='auto') localStorage.removeItem('kb-theme');
    else localStorage.setItem('kb-theme', mode);
  }catch(e){}
  updateThemeBtn();
  if(window.mermaid){
    mermaid.initialize({startOnLoad:false, securityLevel:'loose', theme: eff==='dark'?'dark':'default'});
    rerenderMermaid();
  }
}
function cycleTheme(){
  const m = document.documentElement.dataset.themeMode;
  applyTheme(m==='auto' ? 'light' : m==='light' ? 'dark' : 'auto');
}
if(mq && mq.addEventListener){
  mq.addEventListener('change', ()=>{ if(document.documentElement.dataset.themeMode==='auto') applyTheme('auto'); });
}

/* ==================== 库导航显隐（需求 4） ==================== */
function toggleNav(){
  settings.navHidden = !settings.navHidden;
  saveSettings();
  applyNavState();
}
function applyNavState(){
  const wide = window.innerWidth >= 1200;
  if(wide){
    document.body.classList.toggle('nav-hidden', !!settings.navHidden);
    document.body.classList.remove('nav-open');
  }else{
    document.body.classList.remove('nav-hidden');
    document.body.classList.toggle('nav-open', !!state.navOpen);
  }
}
$('#navBtn').addEventListener('click', ()=>{
  if(window.innerWidth >= 1200) toggleNav();
  else { state.navOpen = !state.navOpen; document.body.classList.toggle('nav-open', state.navOpen); }
});
window.addEventListener('resize', applyNavState);

/* ==================== 快捷键 ==================== */
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  const typing = tag==='input' || tag==='textarea' || tag==='select' || e.target.isContentEditable;
  if(e.key==='/' && !typing){
    e.preventDefault(); $('#q').focus(); $('#q').select();
  }else if(e.key==='Escape'){
    if(document.querySelector('.overlay')) closeModal();
    else if(document.body.classList.contains('detail-open')) closeDetail();
    else if(document.body.classList.contains('nav-open')){ state.navOpen=false; document.body.classList.remove('nav-open'); }
    else if(typing) e.target.blur();
  }else if(e.key==='[' && !typing){
    e.preventDefault();
    if(window.innerWidth>=1200) toggleNav();
    else { state.navOpen=!state.navOpen; document.body.classList.toggle('nav-open', state.navOpen); }
  }else if(!typing && (e.key==='ArrowDown' || e.key==='ArrowUp')){
    if(state.view!=='results' || !state.hits.length) return;
    e.preventDefault();
    const n = state.hits.length;
    selectHit(((state.kbIdx + (e.key==='ArrowDown'?1:-1)) % n + n) % n);
  }else if(!typing && e.key==='Enter' && state.kbIdx>=0 && state.view==='results'){
    hitClick(state.kbIdx);
  }
});

/* ==================== 初始化 ==================== */
async function refreshAll(){ await loadNav(); updateWsTitle(); loadGenreChips(); if(state.view==='results') doSearch(); }
updateThemeBtn();
applyNavState();
updateWsTitle();
$('#results').innerHTML = emptyHtml('search','搜索你的知识库','左侧点库进入工作台；输入关键词（多词空格分隔）<br>或直接回车按时间倒序浏览最近文档',['周报 多模态','FTS5','校准']);
$('#detail').innerHTML = '<div style="padding:14px">'+emptyHtml('panel','点击结果查看详情','支持 Markdown / 图片 / Mermaid / 代码 / LaTeX 渲染。<br><kbd>↑</kbd><kbd>↓</kbd> 切换结果 · <kbd>Enter</kbd> 打开 · <kbd>Esc</kbd> 关闭 · <kbd>[</kbd> 导航显隐')+'</div>';
loadNav().then(()=>{ updateWsTitle(); loadGenreChips(); });
</script>
