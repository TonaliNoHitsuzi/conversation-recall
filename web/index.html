<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-theme-mode="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库终端</title>
<script>
/* 主题引导：首帧前确定明暗，避免闪烁。localStorage 无记录时跟随系统。 */
(function(){
  var mode = null;
  try{ mode = localStorage.getItem('kb-theme'); }catch(e){}
  var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var hash = /[#&]theme=(light|dark)/.exec(location.hash || '');
  if(!mode && hash) mode = hash[1];   // 支持 #theme=dark 直达
  document.documentElement.dataset.themeMode = mode || 'auto';
  document.documentElement.dataset.theme = mode || (dark ? 'dark' : 'light');
})();
</script>
<link rel="stylesheet" href="assets/github-markdown.css">
<style>
/* ============ 设计变量：暖纸底 × 深海军蓝墨 × 单一青石蓝强调 ============ */
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, "JetBrains Mono", monospace;
  --radius: 8px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#F0EEE9;            /* 暖纸灰 */
  --panel:#FBFAF7;         /* 卡片面 */
  --panel-2:#F2F0E9;       /* 下沉面/输入框底 */
  --hover:#ECEAE2;
  --ink:#12283F;           /* 深海军蓝墨 */
  --ink-2:#50637A;
  --ink-3:#8A99AB;
  --line:#DFDACD;
  --line-2:#C7C0AE;
  --accent:#0F5BB5;        /* 青石蓝 */
  --accent-strong:#0B4A96;
  --accent-soft:rgba(15,91,181,.09);
  --good:#177245;  --good-soft:rgba(23,114,69,.12);
  --warn:#A84E08;  --warn-soft:rgba(168,78,8,.12);
  --bad:#C22F2F;   --bad-soft:rgba(194,47,47,.10);
  --dom-conv:#0E7C8C;  --dom-weekly:#B15E09;  --dom-project:#6C3FC4;  --dom-gray:#6B7684;
  --code-bg:#EFEEE7;
  --shadow-sm:0 1px 2px rgba(18,40,63,.07);
  --shadow-lg:0 12px 32px rgba(18,40,63,.14), 0 2px 6px rgba(18,40,63,.08);
  --hljs-comment:#6E7781; --hljs-keyword:#CF222E; --hljs-string:#0A3069;
  --hljs-number:#0550AE;  --hljs-title:#8250DF;   --hljs-attr:#0550AE;
  --hljs-builtin:#953800; --hljs-meta:#6E7781;    --hljs-add:#116D29; --hljs-del:#82071E;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0D1218;
  --panel:#141B24;
  --panel-2:#1B2430;
  --hover:#202B39;
  --ink:#C7D1DD;           /* 哑灰白，避免纯白刺眼 */
  --ink-2:#8C99A9;
  --ink-3:#5D6B7C;
  --line:#27313F;
  --line-2:#37434F;
  --accent:#5C9CEC;
  --accent-strong:#7FB2F2;
  --accent-soft:rgba(92,156,236,.15);
  --good:#47B97F;  --good-soft:rgba(71,185,127,.15);
  --warn:#E09A4A;  --warn-soft:rgba(224,154,74,.15);
  --bad:#E86B6B;   --bad-soft:rgba(232,107,107,.14);
  --dom-conv:#3BB9C9;  --dom-weekly:#E09A4A;  --dom-project:#A98CF0;  --dom-gray:#7D8B9C;
  --code-bg:#0F1720;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
  --hljs-comment:#8B949E; --hljs-keyword:#FF7B72; --hljs-string:#A5D6FF;
  --hljs-number:#79C0FF;  --hljs-title:#D2A8FF;   --hljs-attr:#79C0FF;
  --hljs-builtin:#FFA657; --hljs-meta:#8B949E;    --hljs-add:#3FB950; --hljs-del:#F85149;
}

/* ============ 基础 ============ */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  background:var(--bg); color:var(--ink);
  font:14px/1.6 var(--font);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
button{font-family:inherit}
a{color:var(--accent)}
.num, b.num{font-variant-numeric:tabular-nums}

/* 细滚动条 */
.col-body, .status, .mdhost{scrollbar-width:thin; scrollbar-color:var(--line-2) transparent}
.col-body::-webkit-scrollbar, .mdhost::-webkit-scrollbar{width:8px;height:8px}
.col-body::-webkit-scrollbar-thumb, .mdhost::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:4px}
.col-body::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

/* ============ 图标 ============ */
.ic{width:15px;height:15px;flex:0 0 auto;vertical-align:-2px}
.ic-lg{width:26px;height:26px;color:var(--ink-3)}

/* ============ 顶部 header ============ */
header{
  flex:0 0 auto; z-index:20;
  background:var(--panel); border-bottom:1px solid var(--line); box-shadow:var(--shadow-sm);
}
.bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; max-width:1600px; margin:0 auto; padding:8px 14px}
.brand{display:flex; align-items:center; gap:8px; margin-right:6px; user-select:none}
.brand-mark{width:24px;height:24px;border-radius:6px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand-mark svg{width:15px;height:15px;stroke:var(--bg)}
:root[data-theme="dark"] .brand-mark{background:var(--accent)}
:root[data-theme="dark"] .brand-mark svg{stroke:#0D1218}
.brand-name{font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand-tag{font-size:10px;font-weight:600;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:2px}

.searchbox{
  flex:1 1 240px; min-width:180px; display:flex; align-items:center; gap:7px;
  background:var(--panel-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:5px 10px; transition:border-color .15s, box-shadow .15s;
}
.searchbox:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:var(--panel)}
.searchbox .ic{color:var(--ink-3)}
.searchbox input{flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:14px var(--font); outline:none}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox kbd{
  font:600 11px var(--mono); color:var(--ink-3); background:var(--panel);
  border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px;
}

/* 次级筛选行：≥1200 内联展开，<1200 由筛选按钮控制开合 */
.bar-sub{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
#filterBtn{display:none}
@media (max-width:1199px){
  #filterBtn{display:inline-flex}
  .bar-sub{display:none; order:10; flex-basis:100%; padding-top:2px}
  .bar-sub.open{display:flex}
}
.bar-util{display:flex; align-items:center; gap:6px; margin-left:auto}

/* 控件 */
.selwrap{position:relative; display:inline-flex}
.selwrap select{
  appearance:none; -webkit-appearance:none;
  padding:6px 26px 6px 10px; border:1px solid var(--line); border-radius:7px;
  background:var(--panel); color:var(--ink); font:500 13px var(--font); cursor:pointer;
  transition:border-color .15s, background .15s;
}
.selwrap select:hover{border-color:var(--line-2); background:var(--hover)}
.selwrap::after{
  content:''; position:absolute; right:10px; top:50%; width:6px; height:6px;
  border-right:1.5px solid var(--ink-2); border-bottom:1.5px solid var(--ink-2);
  transform:translateY(-70%) rotate(45deg); pointer-events:none;
}
input[type="date"], .notq{
  padding:5px 8px; border:1px solid var(--line); border-radius:7px;
  background:var(--panel); color:var(--ink); font:13px var(--font);
}
.notq{width:130px}
input[type="date"]:focus, .notq:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
.dates-sep{color:var(--ink-3); font-size:12px}

/* 按钮 */
.btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 11px; border:1px solid var(--line); border-radius:7px;
  background:var(--panel); color:var(--ink);
  font:500 13px/1.4 var(--font); cursor:pointer; white-space:nowrap;
  transition:background .15s, border-color .15s, transform .15s, box-shadow .15s;
}
.btn:hover{background:var(--hover); border-color:var(--line-2); transform:translateY(-1px); box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0); box-shadow:none}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:var(--accent-strong); border-color:var(--accent-strong)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft); border-color:var(--bad)}
.btn.icon-only{padding:6px 8px}
.btn .ic{stroke-width:2}

/* 两步确认：红底 + 底部倒计时进度条 */
.btn.armed{background:var(--bad)!important; border-color:var(--bad)!important; color:#fff!important; position:relative; overflow:hidden}
.btn.armed::after{
  content:''; position:absolute; left:0; bottom:0; height:2px; width:100%;
  background:rgba(255,255,255,.9); animation:armcount 3.5s linear forwards;
}
@keyframes armcount{from{width:100%}to{width:0}}

/* ============ 状态栏（域索引 + 存储仪表） ============ */
.status{
  display:flex; align-items:center; gap:12px; max-width:1600px; margin:0 auto;
  padding:4px 14px 8px; font-size:12px; color:var(--ink-2);
  overflow-x:auto; white-space:nowrap; scrollbar-width:none;
}
.status::-webkit-scrollbar{display:none}
.st-chip{display:inline-flex; align-items:center; gap:5px}
.st-chip b{font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}
.st-chip.off{color:var(--ink-3)}
.dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto}
.dot.c-conv{background:var(--dom-conv)} .dot.c-week{background:var(--dom-weekly)}
.dot.c-proj{background:var(--dom-project)} .dot.c-gray{background:var(--dom-gray)}
.st-meter{margin-left:auto; display:inline-flex; align-items:center; gap:8px; flex:0 0 auto}
.st-meter-bar{width:90px; height:4px; border-radius:2px; background:var(--panel-2); overflow:hidden; border:1px solid var(--line)}
.st-meter-bar i{display:block; height:100%; background:var(--accent); border-radius:2px; transition:width .6s var(--ease)}
.st-meter-bar i.over{background:var(--bad)}
.st-meter .over-txt{color:var(--bad); font-weight:600}
.st-err{color:var(--bad)}
</style>
<style>
/* ============ 主区：左右双栏独立滚动 ============ */
.main{
  flex:1 1 auto; min-height:0; width:100%; max-width:1600px; margin:0 auto;
  display:grid; grid-template-columns:minmax(340px,5fr) 7fr; gap:12px; padding:12px 14px;
}
@media (min-width:768px) and (max-width:1199px){
  .main{grid-template-columns:1fr 1fr}
}
.col{
  display:flex; flex-direction:column; min-height:0; min-width:0;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow-sm); overflow:hidden;
}
.col-head{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  padding:9px 14px; border-bottom:1px solid var(--line);
  font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--ink-3);
}
.col-head .spacer{flex:1}
.col-head .cnt{font-weight:600; letter-spacing:0; font-variant-numeric:tabular-nums}
.col-head .mini-btn{
  display:inline-flex; align-items:center; gap:4px; border:0; background:transparent;
  color:var(--accent); font:600 12px var(--font); letter-spacing:0; cursor:pointer; padding:2px 6px; border-radius:5px;
}
.col-head .mini-btn:hover{background:var(--accent-soft)}
.col-body{flex:1 1 auto; min-height:0; overflow-y:auto; padding:10px}
.col-body.flush{padding:0}

/* ============ 结果卡片 ============ */
.hit{
  position:relative; display:block; width:100%; text-align:left; cursor:pointer;
  background:transparent; border:1px solid transparent; border-radius:var(--radius);
  padding:9px 11px 9px 13px; margin:0 0 4px; color:var(--ink);
  transition:background .15s, border-color .15s;
}
.hit:hover{background:var(--hover)}
.hit.sel{background:var(--accent-soft); border-color:var(--accent-soft)}
.hit.sel::before{
  content:''; position:absolute; left:0; top:9px; bottom:9px; width:2px;
  background:var(--accent); border-radius:2px;
}
.hit-top{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:3px}
.hit-title{display:block; font-weight:600; font-size:14px; line-height:1.45}
.hit-sub{display:block; color:var(--ink-2); font-size:12px; margin-top:1px}
.hit-snip{
  display:block; color:var(--ink-3); font-size:12px; line-height:1.55; margin-top:3px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.hit-matched{margin-left:auto; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; cursor:help}

/* 域标签 + 徽标 */
.tag{
  display:inline-flex; align-items:center; padding:1px 7px; border-radius:99px;
  font-size:11px; font-weight:600; line-height:1.6;
}
.tag.c-conv{background:color-mix(in srgb, var(--dom-conv) 13%, transparent); color:var(--dom-conv)}
.tag.c-week{background:color-mix(in srgb, var(--dom-weekly) 14%, transparent); color:var(--dom-weekly)}
.tag.c-proj{background:color-mix(in srgb, var(--dom-project) 13%, transparent); color:var(--dom-project)}
.tag.c-gray{background:var(--panel-2); color:var(--ink-2); border:1px solid var(--line)}
.bdg{display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:0 6px; border-radius:99px; line-height:1.7}
.bdg-good{background:var(--good-soft); color:var(--good)}
.bdg-bad{background:var(--bad-soft); color:var(--bad)}
.bdg-warn{background:var(--warn-soft); color:var(--warn)}

/* ============ 详情面板 ============ */
.dt-sticky{
  position:sticky; top:0; z-index:5;
  background:var(--panel); border-bottom:1px solid var(--line);
  padding:12px 16px 11px;
}
.col-head .dt-back{display:none}
.dt-title-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:9px}
.dt-title{font-size:16px; font-weight:700; margin:0; line-height:1.4; min-width:0}
.dt-pill{
  display:inline-flex; align-items:center; gap:5px; text-decoration:none;
  padding:2px 10px; border-radius:99px; font-size:12px; font-weight:600;
  background:var(--accent-soft); color:var(--accent); border:1px solid transparent;
  transition:border-color .15s, transform .15s;
}
.dt-pill:hover{border-color:var(--accent); transform:translateY(-1px)}
.dt-pill.gray{background:var(--panel-2); color:var(--ink-2); border-color:var(--line)}
.dt-actions{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.dt-actions .sep{width:1px; height:18px; background:var(--line); margin:0 2px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden}
.seg .btn{border:0; border-radius:0; border-right:1px solid var(--line)}
.seg .btn:last-child{border-right:0}
.seg .btn:hover{transform:none; box-shadow:none}
.dt-md{padding:6px 18px 32px}

/* 勘误 / issue 卡片 */
.callout{
  border:1px solid var(--line); border-left:2px solid var(--warn);
  background:var(--warn-soft); border-radius:0 8px 8px 0;
  padding:9px 12px; margin:10px 0; font-size:13px;
}
.callout.issue-open{border-left-color:var(--warn)}
.callout.issue-resolved{border-left-color:var(--good); background:var(--good-soft)}
.callout .when{display:block; color:var(--ink-2); font-size:11px; margin-top:3px}
.callout .lnk{color:var(--accent); cursor:pointer; text-decoration:none; font-weight:600}
.callout .lnk:hover{text-decoration:underline}
.callout.clickable{cursor:pointer; transition:transform .15s, box-shadow .15s}
.callout.clickable:hover{transform:translateY(-1px); box-shadow:var(--shadow-sm)}
.status-pill{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.06em; padding:0 6px; border-radius:4px; margin-right:6px}
.status-pill.open{background:var(--warn-soft); color:var(--warn)}
.status-pill.resolved{background:var(--good-soft); color:var(--good)}

/* 灰库列表 */
.gray-item{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  border:1px solid var(--line); border-radius:var(--radius);
  padding:9px 11px; margin-bottom:6px; cursor:pointer; background:var(--panel);
  transition:border-color .15s, background .15s, transform .15s;
}
.gray-item:hover{border-color:var(--accent); background:var(--accent-soft); transform:translateY(-1px)}
.gray-item > span{flex:1; min-width:0; display:flex; align-items:center; gap:7px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ============ 空态 / 骨架屏 / 提示条 ============ */
.empty{padding:44px 24px; text-align:center; color:var(--ink-2)}
.empty .ic-lg{margin-bottom:10px}
.empty .e-title{font-size:14px; font-weight:600; color:var(--ink); margin-bottom:4px}
.empty .e-sub{font-size:12px; color:var(--ink-3); line-height:1.7}
.empty .e-tips{margin-top:14px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap}
.chip{
  border:1px solid var(--line); background:var(--panel-2); color:var(--ink-2);
  font:500 12px var(--font); padding:3px 10px; border-radius:99px; cursor:pointer;
  transition:all .15s;
}
.chip:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.empty kbd{font:600 11px var(--mono); background:var(--panel-2); border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 4px; color:var(--ink-2)}
.notice{
  font-size:12px; padding:7px 10px; border-radius:7px; margin-bottom:8px;
  background:var(--warn-soft); color:var(--warn); border:1px solid color-mix(in srgb, var(--warn) 25%, transparent);
}
.sk{border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:8px}
.sk i{
  display:block; height:10px; border-radius:5px; margin-bottom:8px;
  background:linear-gradient(90deg, var(--panel-2) 25%, var(--hover) 50%, var(--panel-2) 75%);
  background-size:200% 100%; animation:shimmer 1.15s infinite linear;
}
.sk i:last-child{margin-bottom:0}
@keyframes shimmer{to{background-position:-200% 0}}

/* ============ Toast ============ */
#toastRoot{position:fixed; right:16px; bottom:16px; z-index:90; display:flex; flex-direction:column; gap:8px}
.toast{
  display:flex; align-items:flex-start; gap:8px;
  background:var(--panel); border:1px solid var(--line); border-left:2px solid var(--accent);
  border-radius:8px; box-shadow:var(--shadow-lg);
  padding:10px 14px; min-width:240px; max-width:360px; font-size:13px;
  animation:toast-in .25s var(--ease);
}
.toast.good{border-left-color:var(--good)} .toast.good .ic{color:var(--good)}
.toast.bad{border-left-color:var(--bad)}   .toast.bad .ic{color:var(--bad)}
.toast.info .ic{color:var(--accent)}
.toast.out{opacity:0; transform:translateY(6px); transition:all .3s}
@keyframes toast-in{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

/* ============ 模态框 ============ */
.overlay{
  position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
  background:rgba(9,14,20,.45); backdrop-filter:blur(2px); padding:16px;
  animation:fade-in .15s;
}
.modal{
  width:min(540px,100%); background:var(--panel); border:1px solid var(--line);
  border-radius:12px; box-shadow:var(--shadow-lg); padding:18px 20px;
  animation:pop-in .2s var(--ease);
}
.modal h3{margin:0 0 4px; font-size:15px}
.modal-sub{font-size:12px; color:var(--ink-2); margin:0 0 12px; line-height:1.6}
.modal textarea{
  width:100%; resize:vertical; min-height:110px;
  border:1px solid var(--line); border-radius:8px; padding:9px 11px;
  background:var(--panel-2); color:var(--ink); font:13px/1.6 var(--font); outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.modal textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); background:var(--panel)}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px}
.modal .hint{font-size:11px; color:var(--ink-3); margin-top:8px}
@keyframes fade-in{from{opacity:0}}
@keyframes pop-in{from{opacity:0; transform:scale(.96) translateY(6px)}}

/* ============ github-markdown 颜色接管 ============ */
.markdown-body{
  background:transparent; color:var(--ink);
  font-family:var(--font); font-size:14.5px; line-height:1.75;
}
.markdown-body a{color:var(--accent)}
.markdown-body h1,.markdown-body h2,.markdown-body h3,.markdown-body h4,
.markdown-body h5,.markdown-body h6{color:var(--ink)}
.markdown-body h1,.markdown-body h2{border-bottom:1px solid var(--line)}
.markdown-body hr{background:var(--line); border-bottom-color:var(--line)}
.markdown-body blockquote{color:var(--ink-2); border-left:2px solid var(--line-2); padding:0 1em}
.markdown-body code,.markdown-body tt{background-color:var(--code-bg); border:1px solid var(--line); border-radius:5px; font-family:var(--mono); font-size:.88em}
.markdown-body pre{background-color:var(--code-bg); border:1px solid var(--line); border-radius:8px}
.markdown-body pre code{background:transparent; border:0}
.markdown-body table tr{background-color:transparent; border-top:1px solid var(--line)}
.markdown-body table tr:nth-child(2n){background-color:var(--panel-2)}
.markdown-body table th,.markdown-body table td{border:1px solid var(--line)}
.markdown-body img{background-color:transparent}
.markdown-body .mermaid{display:flex; justify-content:center; padding:12px 0}
.markdown-body mjx-container{color:var(--ink)}

/* ============ hljs 双主题（CSS 变量驱动） ============ */
.hljs{color:var(--ink)}
.hljs-comment,.hljs-quote{color:var(--hljs-comment)}
.hljs-keyword,.hljs-selector-tag,.hljs-doctag,.hljs-template-tag,.hljs-deletion .hljs-keyword{color:var(--hljs-keyword)}
.hljs-string,.hljs-regexp,.hljs-addition,.hljs-attribute,.hljs-meta .hljs-string{color:var(--hljs-string)}
.hljs-number,.hljs-literal{color:var(--hljs-number)}
.hljs-title,.hljs-title.function_,.hljs-section{color:var(--hljs-title)}
.hljs-title.class_,.hljs-type,.hljs-built_in{color:var(--hljs-builtin)}
.hljs-attr,.hljs-variable,.hljs-template-variable,.hljs-selector-id,.hljs-selector-class{color:var(--hljs-attr)}
.hljs-symbol,.hljs-bullet,.hljs-link,.hljs-meta,.hljs-selector-attr,.hljs-selector-pseudo{color:var(--hljs-meta)}
.hljs-addition{color:var(--hljs-add)}
.hljs-deletion{color:var(--hljs-del)}
.hljs-emphasis{font-style:normal}
.hljs-strong{font-weight:700}

/* ============ 响应式 ============ */
@media (max-width:900px){
  .brand-tag{display:none}
}
@media (max-width:767px){
  .main{grid-template-columns:1fr; padding:8px; gap:8px}
  /* 详情变为覆盖式抽屉 */
  .col-detail{
    position:fixed; inset:0; z-index:40; border-radius:0; border:0;
    transform:translateY(102%); transition:transform .3s var(--ease);
    visibility:hidden;
  }
  body.detail-open .col-detail{transform:none; visibility:visible}
  .col-head .dt-back{display:inline-flex}
  .brand-name{display:none}
  .btn .btn-txt{display:none}
  .btn:not(.primary){padding:6px 8px}
  .btn.primary .btn-txt{display:inline}
  .notq{flex:1}
}
@media (max-width:420px){
  .bar{padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important; transition-duration:.01ms!important}
}

  el.querySelectorAll('code.language-mermaid').forEach(function(c){
    const pre = c.parentNode, d = document.createElement('div');
    d.className = 'mermaid';
    d.dataset.mmd = c.textContent;          // 保留源码，供主题切换后重绘
    d.textContent = c.textContent;
    pre.replaceWith(d);
  });
  if(window.mermaid){ try{ mermaid.run({nodes: el.querySelectorAll('.mermaid')}); }catch(e){} }
  el.querySelectorAll('pre code').forEach(function(c){
    if(!c.classList.contains('language-mermaid') && window.hljs){ try{ hljs.highlightElement(c); }catch(e){} }
  });
  if(window.MathJax && MathJax.typesetPromise){ try{ MathJax.typesetPromise([el]); }catch(e){} }
}
function rerenderMermaid(){
  if(!window.mermaid) return;
  const nodes = document.querySelectorAll('.mermaid[data-mmd]');
  if(!nodes.length) return;
  nodes.forEach(d => { d.removeAttribute('data-processed'); d.textContent = d.dataset.mmd; });
  try{ mermaid.run({nodes}); }catch(e){}
}

/* ==================== API ==================== */
async function api(path, opts){
  const r = await fetch(path, opts || {});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function post(path, data){
  return api(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
}

/* ==================== Toast 与模态框 ==================== */
function toast(msg, type, ms){
  type = type || 'info'; ms = ms || 3000;
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.innerHTML = icon(type==='good'?'check':type==='bad'?'err':'info') + '<span>'+msg+'</span>';
  $('#toastRoot').appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 320); }, ms);
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function openIssueModal(){
  if(!cur) return;
  $('#modalRoot').innerHTML =
    '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-label="挂 issue">'+
      '<h3>挂 issue</h3>'+
      '<p class="modal-sub">针对「'+esc(cur.title)+'」——记录这条文档哪里需要修正/补充。issue 挂在原位置，<b>不会改动原文</b>。</p>'+
      '<textarea id="issueNote" placeholder="例如：第二节的参数表已过时，PT100 校准流程在 2026-03 已更新…"></textarea>'+
      '<div class="hint">Ctrl + Enter 提交 · Esc 取消</div>'+
      '<div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitIssue()">提交 issue</button></div>'+
    '</div></div>';
  const ta = $('#issueNote');
  ta.focus();
  ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) submitIssue(); });
}
async function submitIssue(){
  const note = $('#issueNote').value.trim();
  if(!note){ toast('issue 内容不能为空','bad'); return; }
  try{
    const r = await post('/api/issue', {domain:cur.domain, unit_id:cur.unit_id, note});
    if(r.ok){ closeModal(); toast('issue 已挂（id='+r.issue.id+'），原文未改动','good'); viewIssues(); loadStatus(); }
    else toast('挂 issue 失败：'+esc(r.err||'未知错误'),'bad');
  }catch(e){ toast('请求失败：'+e.message,'bad'); }
}

/* ==================== 状态栏 ==================== */
async function loadStatus(){
  try{
    const s = await api('/api/status');
    s.domains.forEach(d => DOMAIN_LABELS[d.key] = d.label);
    let html = s.domains.map(d=>{
      const cls = tagClass(d.label);
      return d.available
        ? '<span class="st-chip"><span class="dot '+cls+'"></span>'+esc(d.label)+' <b>'+(d.indexed ?? '?')+' 段</b></span>'
        : '<span class="st-chip off"><span class="dot '+cls+'"></span>'+esc(d.label)+' 离线</span>';
    }).join('');
    const thr = s.size.threshold_mb || 256;
    const pct = Math.min(100, (s.size.total_mb / thr) * 100);
    const over = s.size.total_mb >= thr;
    html += '<span class="st-meter" title="存储占用 '+s.size.total_mb+' MB / 阈值 '+thr+' MB">'+
      '<span>存储 <b class="num">'+s.size.total_mb+'</b> MB</span>'+
      '<span class="st-meter-bar"><i style="width:'+pct+'%" class="'+(over?'over':'')+'"></i></span>'+
      (over ? '<span class="over-txt">超阈值</span>' : '')+
    '</span>';
    $('#status').innerHTML = html;
  }catch(e){
    $('#status').innerHTML = '<span class="st-err">⚠ 无法连接后端（/api/status 请求失败），请确认 server.py 已启动'+(window.__MOCK?'':'；或在 URL 加 ?mock=1 查看演示数据')+'</span>';
  }
}

/* ==================== 搜索 ==================== */
function onTimeChange(){
  $('#dates').style.display = ($('#time').value === 'custom') ? '' : 'none';
}
function timeRange(){
  const t = $('#time').value;
  if(t === 'all') return {since:null, until:null};
  if(t === 'custom'){
    const s = $('#since_date').value, u = $('#until_date').value;
    return { since: s ? new Date(s).getTime() : null,
             until: u ? new Date(u).getTime() + 86400000 - 1 : null };  // 含当日
  }
  const days = parseInt(t);
  return {since: Date.now() - days*86400000, until:null};
}
function skeletonHtml(n){
  let s = '';
  for(let i=0;i<n;i++) s += '<div class="sk"><i style="width:38%"></i><i style="width:72%"></i><i style="width:60%"></i></div>';
  return s;
}
async function doSearch(){
  const q = $('#q').value.trim();
  const dom = $('#domain').value;
  const tr = timeRange();
  let url = '/api/search?q=' + encodeURIComponent(q) + '&domain=' + encodeURIComponent(dom);
  if(tr.since != null) url += '&since=' + tr.since;
  if(tr.until != null) url += '&until=' + tr.until;
  const notq = $('#notq').value.trim();
  if(notq) url += '&not=' + encodeURIComponent(notq);

  state.view = 'results';
  setLeftHead('命中结果', false);
  $('#results').innerHTML = skeletonHtml(4);
  $('#resultMeta').textContent = '搜索中…';
  try{
    const d = await api(url);
    state.hits = (d.hits||[]).map(h=>({h, gray:false})).concat((d.gray_hits||[]).map(h=>({h, gray:true})));
    state.searchMeta = d;
    state.kbIdx = -1;
    state.searchedOnce = true;
    renderResults();
  }catch(e){
    $('#resultMeta').textContent = '';
    $('#results').innerHTML = emptyHtml('inbox', '搜索失败', '无法连接后端接口 /api/search。<br>请确认 server.py 已启动。');
  }
}
function setLeftHead(title, showBack){
  $('#leftTitle').textContent = title;
  $('#backToResults').style.display = showBack ? '' : 'none';
}
function backToResults(){
  state.view = 'results';
  setLeftHead('命中结果', false);
  renderResults();
}
function renderResults(){
  const box = $('#results'), d = state.searchMeta || {};
  if(!state.hits.length){
    $('#resultMeta').textContent = state.searchedOnce ? '0 条' : '';
    box.innerHTML = state.searchedOnce
      ? emptyHtml('search', '未命中',
          '换个关键词或减少筛选条件试试。' + (d.offline && d.offline.length ? '<br>（' + esc(d.offline.join('、')) + ' 离线，已跳过）' : ''))
      : emptyHtml('search', '搜索你的知识库',
          '输入关键词（多词空格分隔，召回更准）<br>或直接回车，按时间倒序浏览最近文档',
          ['PT100 校准', '周报 多模态', 'FTS5']);
    return;
  }
  let html = '';
  if(d.used_gray_fallback) html += '<div class="notice">⚠ active 域全空，已回退查灰库</div>';
  state.hits.forEach(({h, gray}, i)=>{
    html += '<button class="hit'+(i===state.kbIdx?' sel':'')+'" data-i="'+i+'" onclick="hitClick('+i+')">'+
      '<span class="hit-top"><span class="tag '+tagClass(h.domain_label)+'">'+esc(h.domain_label)+'</span>'+ badgeHtml(h.badge) +
      '<span class="hit-matched" title="该条命中的搜索共识词数，用于排序">命中 '+h.matched+' 词</span></span>'+
      '<span class="hit-title">'+esc(h.title)+'</span>'+
      '<span class="hit-sub">'+esc(h.sub)+'</span>'+
      '<span class="hit-snip">'+esc(h.snippet)+'</span>'+
    '</button>';
  });
  box.innerHTML = html;
  $('#resultMeta').textContent = state.hits.length + ' 条';
}
function emptyHtml(ic, title, sub, tips){
  let s = '<div class="empty">'+iconLg(ic)+'<div class="e-title">'+title+'</div><div class="e-sub">'+sub+'</div>';
  if(tips && tips.length){
    s += '<div class="e-tips">试试：' + tips.map(t=>'<button class="chip" onclick="quickSearch(\''+esc(t)+'\')">'+esc(t)+'</button>').join('') + '</div>';
  }
  return s + '</div>';
}
function quickSearch(t){ $('#q').value = t; doSearch(); }
function hitClick(i){
  selectHit(i);
  const it = state.hits[i];
  if(it) expand(it.h.ref_id, it.gray);
}
function selectHit(i){
  state.kbIdx = i;
  document.querySelectorAll('#results .hit').forEach(el=>{
    el.classList.toggle('sel', +el.dataset.i === i);
  });
  const el = document.querySelector('#results .hit[data-i="'+i+'"]');
  if(el) el.scrollIntoView({block:'nearest'});
}
</script>
<script>
/* ==================== 详情 ==================== */
function detailSkeleton(){
  $('#detail').innerHTML = '<div style="padding:14px">'+skeletonHtml(3)+'</div>';
  $('#detailMeta').textContent = '加载中…';
}
async function expand(id, isGray){
  document.body.classList.add('detail-open');
  detailSkeleton();
  try{
    const d = await api('/api/expand?id=' + encodeURIComponent(id));
    if(d.err){ $('#detail').innerHTML = '<div class="empty">'+esc(d.err)+'</div>'; return; }
    cur = {domain:d.domain, unit_id:d.unit_id, title:d.title, ref_id:id, isGray:!!(d.isGray || isGray)};
    showDetail(d);
  }catch(e){ $('#detail').innerHTML = emptyHtml('err','加载失败','无法连接 /api/expand。'); $('#detailMeta').textContent=''; }
}
async function whole(id, kind){
  document.body.classList.add('detail-open');
  detailSkeleton();
  try{
    const d = await api('/api/whole?id=' + encodeURIComponent(id) + '&kind=' + kind);
    if(d.err){ $('#detail').innerHTML = '<div class="empty">'+esc(d.err)+'</div>'; return; }
    cur = {domain:d.domain, unit_id:d.unit_id, title:d.title, ref_id:(cur && cur.ref_id) || id, isGray:!!d.isGray};
    showDetail(d, true);
  }catch(e){ $('#detail').innerHTML = emptyHtml('err','加载失败','无法连接 /api/whole。'); $('#detailMeta').textContent=''; }
}
function showDetail(d, isWhole){
  const wholeKind = (cur.domain === 'conversation') ? 'session' : 'document';
  let head = '<div class="dt-sticky">'+
    '<div class="dt-title-row">'+
      '<span class="tag '+tagClass(domainLabel(d.domain))+'">'+esc(domainLabel(d.domain))+'</span>'+
      '<h3 class="dt-title">'+esc(d.title)+'</h3>'+
      (cur && cur.isGray ? '<span class="dt-pill gray">'+icon('archive')+'灰库中</span>' : '')+
      (d.multimodal_url ? '<a class="dt-pill" href="'+esc(d.multimodal_url)+'" target="_blank" rel="noopener">'+icon('ext')+'多模态展示（kimi）</a>' : '')+
    '</div>'+
    '<div class="dt-actions">'+
      '<span class="seg">'+
        '<button class="btn" onclick="rate(\'useful\')" title="这条对我有用">'+icon('thumbUp')+'有用</button>'+
        '<button class="btn" onclick="rate(\'stale\')" title="内容已过时">'+icon('clock')+'过时</button>'+
        '<button class="btn" onclick="rate(\'wrong\')" title="内容有错误">'+icon('xCircle')+'错误</button>'+
      '</span>'+
      '<span class="sep"></span>'+
      '<button class="btn" onclick="openIssueModal()">'+icon('plus')+'挂 issue</button>'+
      '<button class="btn" onclick="viewIssues()">'+icon('flag')+'看 issue</button>'+
      (isWhole ? '' : '<button class="btn" onclick="whole(\''+esc(cur.unit_id)+'\',\''+wholeKind+'\')">'+icon('doc')+'看全文</button>')+
      (cur && cur.isGray
        ? '<button class="btn danger" onclick="reviveFromDetail(this)">'+icon('undo')+'恢复到 active</button>'
        : (cur && cur.domain && cur.domain.startsWith('project:')
            ? '<button class="btn danger" onclick="evict(this)">'+icon('archive')+'移入灰库</button>' : ''))+
    '</div>'+
  '</div>';
  let body = '<div class="dt-md">';
  if(d.badge && d.badge.errata && d.badge.errata.length){
    d.badge.errata.forEach(e=>{
      body += '<div class="callout">⚠ <b>勘误</b>：'+esc(e.note)+'<span class="when">'+fmtTs(e.ts)+'</span></div>';
    });
  }
  body += '<div class="mdhost markdown-body" id="mdhost"></div></div>';
  $('#detail').innerHTML = head + body;
  $('#detailMeta').textContent = isWhole ? '全文' : '片段';
  $('#detail').scrollTop = 0;
  renderMd(d.md, $('#mdhost'));
}
function closeDetail(){ document.body.classList.remove('detail-open'); }

async function rate(verdict){
  if(!cur) return;
  const NAMES = {useful:'有用', stale:'过时', wrong:'错误'};
  try{
    const r = await post('/api/rate', {domain:cur.domain, unit_id:cur.unit_id, verdict});
    if(r.ok){ toast('已记录「'+NAMES[verdict]+'」· 当前 rank '+r.rank.score, 'good'); loadStatus(); }
    else toast('评分失败：'+esc(r.err||'未知错误'), 'bad');
  }catch(e){ toast('请求失败：'+e.message, 'bad'); }
}
async function viewIssues(){
  if(!cur) return;
  try{
    const d = await api('/api/issues?domain=' + encodeURIComponent(cur.domain) + '&unit_id=' + encodeURIComponent(cur.unit_id));
    let html = '<div class="dt-sticky"><div class="dt-title-row"><h3 class="dt-title">'+esc(cur.title)+' · issue 列表</h3></div>'+
      '<div class="dt-actions"><button class="btn" onclick="expand(\''+esc(cur.ref_id||cur.unit_id)+'\')">← 返回内容</button>'+
      '<button class="btn" onclick="openIssueModal()">'+icon('plus')+'挂 issue</button></div></div><div class="dt-md">';
    if(!d.issues || !d.issues.length){
      html += emptyHtml('flag', '暂无 issue', '这条文档还没有挂过 issue。');
    }else{
      d.issues.forEach(i=>{
        const open = i.status === 'open';
        html += '<div class="callout '+(open?'issue-open':'issue-resolved')+'">'+
          '<span class="status-pill '+i.status+'">'+(open?'未结':'已结')+'</span>'+esc(i.note)+
          '<span class="when">'+fmtTs(i.opened_ts)+
          (open ? ' · <a class="lnk" onclick="closeIssue('+i.id+')">关闭</a>' : ' · 已关闭 '+fmtTs(i.resolved_ts))+
          '</span></div>';
      });
    }
    $('#detail').innerHTML = html + '</div>';
    $('#detailMeta').textContent = (d.issues||[]).length + ' 条 issue';
  }catch(e){ toast('加载 issue 失败：'+e.message, 'bad'); }
}
async function closeIssue(id){
  try{
    const r = await post('/api/issue_close', {id});
    if(r.ok){ toast('issue 已关闭', 'good'); if(state.view==='issues') allIssues(); else if(cur) viewIssues(); loadStatus(); }
    else toast('关闭失败：'+esc(r.err||''), 'bad');
  }catch(e){ toast('请求失败：'+e.message, 'bad'); }
}

/* ==================== 灰库（两步确认） ==================== */
function twoStepBtn(btn, label, fn){
  if(!btn) return;
  if(btn.dataset.armed){
    delete btn.dataset.armed;
    btn.classList.remove('armed');
    if(btn.dataset.orig){ btn.innerHTML = btn.dataset.orig; delete btn.dataset.orig; }
    clearTimeout(window._tsTimer);
    fn();
    return;
  }
  btn.dataset.armed = '1';
  btn.dataset.orig = btn.innerHTML;
  btn.innerHTML = '再点确认 · ' + label;
  btn.classList.add('armed');
  clearTimeout(window._tsTimer);
  window._tsTimer = setTimeout(()=>{
    delete btn.dataset.armed;
    if(btn.dataset.orig){ btn.innerHTML = btn.dataset.orig; delete btn.dataset.orig; }
    btn.classList.remove('armed');
  }, 3500);
}
async function evict(btn){
  if(!cur) return;
  twoStepBtn(btn, '移入灰库', async ()=>{
    try{
      const r = await post('/api/evict', {domain:cur.domain, unit_id:cur.unit_id});
      if(r.ok){ toast('已移入灰库（可从灰库恢复）', 'good'); doSearch(); }
      else toast('失败：'+esc(r.err||''), 'bad');
    }catch(e){ toast('请求失败：'+e.message, 'bad'); }
  });
}
async function reviveFromDetail(btn){
  if(!cur) return;
  twoStepBtn(btn, '恢复到 active', async ()=>{
    try{
      const r = await post('/api/revive', {domain:cur.domain, unit_id:cur.unit_id});
      if(r.ok){ toast('已恢复到 active', 'good'); cur.isGray = false; doSearch(); whole(cur.unit_id, 'document'); }
      else toast('失败：'+esc(r.err||''), 'bad');
    }catch(e){ toast('请求失败：'+e.message, 'bad'); }
  });
}
async function showGray(){
  setLeftHead('灰库 · 失效归档', true);
  $('#resultMeta').textContent = '加载中…';
  $('#results').innerHTML = skeletonHtml(3);
  try{
    const d = await api('/api/gray');
    state.view = 'gray';
    state.grayDocs = d.docs || [];
    renderGray();
    $('#detail').innerHTML = '<div style="padding:14px">'+emptyHtml('archive','灰库','点左侧卡片查看原文；<br>点「恢复」提回 active（两步确认）。')+'</div>';
    $('#detailMeta').textContent = '';
  }catch(e){ $('#results').innerHTML = emptyHtml('err','加载失败','无法连接 /api/gray。'); $('#resultMeta').textContent=''; }
}
function renderGray(){
  const docs = state.grayDocs;
  $('#resultMeta').textContent = docs.length + ' 条';
  if(!docs.length){ $('#results').innerHTML = emptyHtml('archive','灰库为空','被移入灰库的失效文档会出现在这里。'); return; }
  let html = '';
  docs.forEach(doc=>{
    const lab = domainLabel(doc.domain);
    html += '<div class="gray-item" onclick="whole(\''+esc(doc.doc_id)+'\',\'document\')">'+
      '<span><span class="tag '+tagClass(lab)+'">'+esc(lab)+'</span> '+esc(doc.title || doc.doc_id)+'</span>'+
      '<button class="btn danger" onclick="event.stopPropagation();revive(\''+esc(doc.domain)+'\',\''+esc(doc.doc_id)+'\',this)">'+icon('undo')+'恢复</button>'+
    '</div>';
  });
  $('#results').innerHTML = html;
}
async function revive(domain, docId, btn){
  twoStepBtn(btn, '恢复', async ()=>{
    try{
      const r = await post('/api/revive', {domain, unit_id:docId});
      if(r.ok){ toast('已恢复到 active', 'good'); showGray(); }
      else toast('失败：'+esc(r.err||''), 'bad');
    }catch(e){ toast('请求失败：'+e.message, 'bad'); }
  });
}

/* ==================== 全部 issue ==================== */
async function allIssues(){
  setLeftHead('全部未结 issue', true);
  $('#resultMeta').textContent = '加载中…';
  try{
    const d = await api('/api/issues?status=open');
    state.view = 'issues';
    state.issuesAll = d.issues || [];
    renderAllIssues();
  }catch(e){ $('#results').innerHTML = emptyHtml('err','加载失败','无法连接 /api/issues。'); $('#resultMeta').textContent=''; }
}
function renderAllIssues(){
  const list = state.issuesAll;
  $('#resultMeta').textContent = list.length + ' 条';
  if(!list.length){ $('#results').innerHTML = emptyHtml('flag','没有未结 issue','知识库很干净。'); return; }
  let html = '';
  list.forEach(i=>{
    html += '<div class="callout clickable" onclick="openSource(\''+esc(i.domain)+'\',\''+esc(i.unit_id)+'\')">'+
      '<span class="tag '+tagClass(domainLabel(i.domain))+'">'+esc(domainLabel(i.domain))+'</span> '+esc(i.note)+

function openSource(domain, unitId){
  // 点 issue 卡片 → 在详情面板打开原文（对话=整会话，文档=整文档）
  whole(unitId, domain === 'conversation' ? 'session' : 'document');
}

/* ==================== 主题切换（跟随系统 / 亮 / 暗） ==================== */
const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function updateThemeBtn(){
  const mode = document.documentElement.dataset.themeMode;
  const eff = document.documentElement.dataset.theme;
  const btn = $('#themeBtn');
  btn.innerHTML = icon(mode==='auto' ? 'auto' : eff==='dark' ? 'moon' : 'sun');
  btn.title = mode==='auto' ? '主题：跟随系统（当前'+(eff==='dark'?'暗':'亮')+'）· 点击切换亮色'
            : mode==='light' ? '主题：亮色 · 点击切换暗色' : '主题：暗色 · 点击恢复跟随系统';
}
function applyTheme(mode){
  const eff = mode === 'auto' ? (mq && mq.matches ? 'dark' : 'light') : mode;
  document.documentElement.dataset.themeMode = mode;
  document.documentElement.dataset.theme = eff;
  try{
    if(mode === 'auto') localStorage.removeItem('kb-theme');
    else localStorage.setItem('kb-theme', mode);
  }catch(e){}
  updateThemeBtn();
  if(window.mermaid){
    mermaid.initialize({startOnLoad:false, securityLevel:'loose', theme: eff==='dark' ? 'dark' : 'default'});
    rerenderMermaid();
  }
}
function cycleTheme(){
  const m = document.documentElement.dataset.themeMode;
  applyTheme(m === 'auto' ? 'light' : m === 'light' ? 'dark' : 'auto');
}
if(mq && mq.addEventListener){
  mq.addEventListener('change', ()=>{ if(document.documentElement.dataset.themeMode === 'auto') applyTheme('auto'); });
}

/* ==================== 快捷键 ==================== */
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if(e.key === '/' && !typing){
    e.preventDefault();
    $('#q').focus(); $('#q').select();
  }else if(e.key === 'Escape'){
    if(document.querySelector('.overlay')) closeModal();
    else if(document.body.classList.contains('detail-open')) closeDetail();
    else if(typing) e.target.blur();
  }else if(!typing && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){
    if(state.view !== 'results' || !state.hits.length) return;
    e.preventDefault();
    const n = state.hits.length;
    selectHit(((state.kbIdx + (e.key === 'ArrowDown' ? 1 : -1)) % n + n) % n);
  }else if(!typing && e.key === 'Enter' && state.kbIdx >= 0 && state.view === 'results'){
    hitClick(state.kbIdx);
  }
});

/* ==================== 初始化 ==================== */
$('#filterBtn').addEventListener('click', ()=> $('#barSub').classList.toggle('open'));
updateThemeBtn();
backToResults();
$('#detail').innerHTML = '<div style="padding:14px">'+emptyHtml('panel','点击左侧结果查看详情','支持 Markdown / Mermaid / 代码高亮 / LaTeX 渲染。<br><kbd>↑</kbd><kbd>↓</kbd> 切换结果 · <kbd>Enter</kbd> 打开 · <kbd>Esc</kbd> 关闭')+'</div>';
loadStatus();
</script>
